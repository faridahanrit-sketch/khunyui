.shop-banner{width:100%;margin:0 0 24px}
.shop-banner[hidden]{display:none}
.shop-banner-open{position:relative;display:block;width:100%;padding:0;border:0;border-radius:20px;background:#07513c;overflow:hidden;cursor:zoom-in;box-shadow:0 12px 28px #17382d1a}
.shop-banner-open:focus-visible{outline:3px solid #9c6f22;outline-offset:4px}
.shop-banner-image{display:block;width:100%;height:auto;max-width:100%;object-fit:contain}
.shop-banner-badge{position:absolute;right:14px;bottom:12px;padding:7px 12px;border:1px solid #fff8e4aa;border-radius:999px;background:#123d31e6;color:#fff8e4;font-size:12px;font-weight:600}
body.banner-viewing{overflow:hidden}
#shopBannerViewer{box-sizing:border-box;position:fixed;inset:0;width:100vw;max-width:none;height:100vh;height:100dvh;max-height:none;margin:0;padding:0;border:0;border-radius:0;background:#101c17;color:#fff9e9}
#shopBannerViewer[open]{display:flex;flex-direction:column}
#shopBannerViewer::backdrop{background:#07110bf5}
#shopBannerViewer *{box-sizing:border-box}
#shopBannerViewer .banner-viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid #ffffff24}
#shopBannerViewer h2{margin:0;color:#fff9e9;font-size:18px;font-family:inherit;line-height:1.4}
#shopBannerViewer .banner-viewer-head p{margin:3px 0 0;color:#d2ddcf;font-size:12px}
#shopBannerViewer button,#shopBannerViewer a{font-family:inherit;font-size:14px;line-height:1.5}
#shopBannerViewer button{min-width:44px;min-height:44px;padding:8px 14px;border:1px solid #ffffff50;border-radius:10px;background:#254637;color:#fff9e9;cursor:pointer}
#shopBannerViewer button:disabled{opacity:.45;cursor:default}
#shopBannerViewer button:focus-visible,#shopBannerViewer a:focus-visible{outline:3px solid #f9cd70;outline-offset:3px}
#shopBannerViewer .banner-viewer-close{flex:none}
#shopBannerViewer .banner-viewer-viewport{flex:1;min-width:0;min-height:0;width:100%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#shopBannerViewer .banner-viewer-viewport:focus-visible{outline:2px solid #f9cd70;outline-offset:-3px}
#shopBannerViewer .banner-viewer-canvas{display:grid;place-items:center;min-width:100%;min-height:100%;padding:12px}
#shopBannerViewer .banner-viewer-image{display:block;width:auto;max-width:none;max-height:none;object-fit:contain;user-select:none}
#shopBannerViewer .banner-viewer-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px max(12px,env(safe-area-inset-bottom));border-top:1px solid #ffffff24}
#shopBannerViewer .banner-zoom-controls{display:flex;align-items:center;gap:8px;max-width:100%}
#shopBannerViewer .banner-zoom-label{min-width:64px;color:#fff9e9;text-align:center;font-size:13px}
#shopBannerViewer .banner-original-link{display:inline-flex;align-items:center;min-height:44px;padding:8px;color:#ffdc94;text-decoration:underline;text-underline-offset:4px}
#shopBannerViewer .banner-viewer-error{margin:12px 20px;color:#ffdc94}
@media(max-width:600px){.shop-banner{margin-bottom:18px}.shop-banner-open{border-radius:13px}.shop-banner-badge{right:8px;bottom:7px;padding:4px 8px;font-size:10px}#shopBannerViewer .banner-viewer-head{padding:12px}#shopBannerViewer h2{font-size:16px}#shopBannerViewer .banner-viewer-tools{padding-left:12px;padding-right:12px;gap:8px}#shopBannerViewer .banner-zoom-controls{gap:5px}#shopBannerViewer .banner-zoom-label{min-width:56px}}
@media(prefers-reduced-motion:reduce){#shopBannerViewer *{scroll-behavior:auto}}

/* Match the existing Khunyui palette and controls while retaining Jele data and routes. */
:root{--cream:#F9F8EF;--card:#FFFEF9;--ink:#1D2A22;--muted:#6B7068;--line:#E6E0CF;--green:#06412A;--green-2:#0B5638;--green-soft:#E4EDE6;--gold:#B89A5A;--gold-soft:#F1EAD8;--red:#A63A2A;--red-soft:#F6E4DF;--paper:var(--cream);--white:var(--card);--cyan:var(--green);--cyan-dark:var(--green);--pale:var(--green-soft);--wood:#4D3728;--shadow:0 4px 16px #30261208}
html{background:var(--cream)}

body .site-header nav{gap:8px}
body .site-header nav a{min-height:44px;display:flex;align-items:center;justify-content:center;padding:9px 16px;border:1px solid var(--gold);border-radius:999px;white-space:nowrap}
body .site-header nav a.active{color:var(--green);background:var(--card);box-shadow:none;border-color:var(--gold)}
body .header-cart{height:46px;min-width:46px;border:1px solid var(--gold);border-radius:999px;background:var(--card);box-shadow:none}

body #app{max-width:1080px;padding:28px 28px 120px}
body .shop-banner{margin:0 0 24px}

body .shop-banner-placeholder{border-radius:18px}

body .status-pill{padding:7px 11px;background:var(--green-soft);color:var(--green);border:1px solid var(--line);box-shadow:none;font-size:11px}
body .status-pill.closed{background:var(--gold-soft);color:var(--muted)}
body .shop-layout,body .mother-layout{display:block}
body .feature-dish{display:none}

body .primary,body .add-menu-button{background:var(--green);border:1px solid var(--green);color:var(--card)}

body .text-button{color:var(--green)}

body .draft-intro{padding:14px 16px;margin-bottom:18px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);box-shadow:none}

const STATUS={new:'ใหม่',preparing:'กำลังทำ',ready:'พร้อมรับ',completed:'เสร็จสิ้น',cancelled:'ยกเลิก'};
const CATEGORIES=[['all','ทั้งหมด'],['made','อาหารตามสั่ง'],['yum','ยำ'],['som','ส้มตำ'],['side','ของทานคู่']];
const STOCK=[['pork','หมู'],['shrimp','กุ้ง'],['squid','หมึก'],['fish','ปลา'],['glass','วุ้นเส้น'],['small','เส้นเล็ก'],['sticky','ข้าวเหนียว'],['khanom','ขนมจีน']];
const uuid=()=>offlineUuid();
const clone=value=>offlineClone(value);
function bangkokDate(value=new Date()){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value));return ['year','month','day'].map(k=>parts.find(p=>p.type===k).value).join('-');}
function parseBaht(raw,{allowZero=false}={}){if(raw===null||raw===undefined||String(raw).trim()==='')return null;const s=String(raw).trim();if(!/^\d{1,6}(?:\.\d{1,2})?$/.test(s))throw Error('ใส่ราคาเป็นตัวเลข ไม่เกิน 2 ตำแหน่งทศนิยม');const [whole,part='']=s.split('.');const n=Number(whole)*100+Number(part.padEnd(2,'0'));if(!Number.isSafeInteger(n)||n<0||(!allowZero&&n===0))throw Error('ราคาจานต้องมากกว่า 0 บาท');return n;}
function defaultState(catalog){return {version:2,revision:0,storeSlug:'jele',settings:{open:false,closedDate:null},stock:Object.fromEntries(STOCK.map(([k])=>[k,true])),menu:clone(catalog).map(d=>({...d,published:false})),orders:[],requests:{},closings:[],sequence:0,createdAt:new Date().toISOString()};}
const groupsFor=dish=>(dish.groups||[]).filter(g=>g.active!==false);
const isStockReady=(state,keys=[])=>keys.every(key=>state.stock[key]!==false);
function choiceAvailable(state,value){return value.available!==false&&isStockReady(state,value.stockKeys);}
function baseAvailable(state,dish){return dish.active!==false&&dish.available!==false&&isStockReady(state,dish.stockKeys)&&(!dish.recipeRequired||(!!dish.recipe?.trim()&&dish.stockKeys?.length>0));}
function dishConfigured(state,dish){if(!baseAvailable(state,dish))return false;if(dish.priceMode==='choice'){const first=groupsFor(dish)[0];return !!first?.values.some(v=>choiceAvailable(state,v)&&Number.isInteger(v.price)&&v.price>0);}return Number.isInteger(dish.price)&&dish.price>0&&groupsFor(dish).every(g=>!g.required||g.values.some(v=>choiceAvailable(state,v)&&Number.isInteger(v.delta??0)));}
function displayPrices(state,dish){if(!dishConfigured(state,dish))return [];return dish.priceMode==='choice'?groupsFor(dish)[0].values.filter(v=>choiceAvailable(state,v)&&Number.isInteger(v.price)&&v.price>0).map(v=>v.price):[dish.price];}
function lineFor(state,dishId,{selected=[],qty=1,note='',spice='เผ็ดน้อย'}={}){const dish=state.menu.find(d=>d.id===dishId);if(!dish||!menuReady(state,dish))throw Error('เมนูนี้ยังไม่พร้อมขาย กรุณาตรวจราคาและของที่มี');if(!Number.isInteger(qty)||qty<1||qty>99)throw Error('จำนวนต้องอยู่ระหว่าง 1 ถึง 99');if(!Array.isArray(selected)||new Set(selected).size!==selected.length)throw Error('ตัวเลือกไม่ถูกต้อง');const groups=groupsFor(dish);const all=groups.flatMap(g=>g.values);if(selected.some(id=>!all.some(v=>v.id===id)))throw Error('พบตัวเลือกที่ไม่ได้อยู่ในเมนูนี้');let price=dish.priceMode==='choice'?null:dish.price;const names=[];const selections=[];
  for(let i=0;i<groups.length;i++){const g=groups[i];const picked=g.values.filter(v=>selected.includes(v.id));const min=g.min??(g.required?1:0),max=g.max??1;if(picked.length<min||picked.length>max)throw Error('กรุณา'+g.name+(max===1?' 1 อย่าง':''));for(const v of picked){if(!choiceAvailable(state,v))throw Error(v.name+'หมดชั่วคราว');if(dish.priceMode==='choice'&&i===0){if(!Number.isInteger(v.price)||v.price<=0)throw Error(v.name+'ยังไม่ได้ตั้งราคา');price=v.price;}else price+=(v.delta??0);names.push(v.name);selections.push({id:v.id,name:v.name,group:g.name});}}
  if(!Number.isInteger(price)||price<=0)throw Error('เมนูนี้ยังไม่ได้ตั้งราคา');return {dishId:dish.id,name:dish.name,unitPrice:price,qty,total:price*qty,selected:[...selected],selections,optionNames:names,note:String(note).trim().slice(0,200),spice:dish.category==='side'?'':String(spice).slice(0,40),photoKey:dish.photoKey||null};}
function createOrder(state,input,now=new Date().toISOString()){const s=clone(state);const requestId=String(input.requestId||'');if(!/^[A-Za-z0-9_-]{8,100}$/.test(requestId))throw Error('กรุณาส่งรายการใหม่อีกครั้ง');if(s.requests[requestId]){const order=s.orders.find(o=>o.id===s.requests[requestId]);if(order)return {state:s,order,duplicate:true};throw Error('ไม่พบรายการเดิม กรุณาตรวจประวัติ');}if(!s.settings.open)throw Error('แม่ยังไม่เปิดรับรายการค่ะ');if(!Array.isArray(input.lines)||!input.lines.length||input.lines.length>50)throw Error('เลือกอาหารก่อนส่งรายการค่ะ');if(!['dine_in','takeaway'].includes(input.fulfillment))throw Error('เลือกทานที่ร้านหรือกลับบ้าน');const lines=input.lines.map(l=>lineFor(s,l.dishId,l));s.sequence+=1;const order={id:uuid(),code:'ฝึก '+String(s.sequence).padStart(3,'0'),status:'new',fulfillment:input.fulfillment,customerId:String(input.customerId||'practice').slice(0,100),lines,total:lines.reduce((t,l)=>t+l.total,0),paid:false,paymentMethod:null,paidAt:null,refund:null,createdAt:now,updatedAt:now,businessDate:bangkokDate(now),requestId};s.orders.push(order);s.requests[requestId]=order.id;return {state:s,order,duplicate:false};}
function orderIn(s,id){const order=s.orders.find(o=>o.id===id);if(!order)throw Error('ไม่พบรายการนี้');return order;}
function advanceOrder(state,id,now=new Date().toISOString()){const s=clone(state),o=orderIn(s,id);if(o.status==='new')o.status='preparing';else if(o.status==='preparing')o.status='ready';else if(o.status==='ready'&&o.paid)o.status='completed';else if(o.status==='completed')return s;else throw Error(o.status==='ready'?'รับเงินก่อนจบรายการค่ะ':'รายการนี้เลื่อนต่อไม่ได้');o.updatedAt=now;return s;}
function payOrder(state,id,{finish=true,method='cash'}={},now=new Date().toISOString()){const s=clone(state),o=orderIn(s,id);if(o.status==='cancelled')throw Error('รายการนี้ยกเลิกแล้ว');if(!['cash','promptpay_qr'].includes(method))throw Error('เลือกวิธีรับเงิน');if(finish&&!['ready','completed'].includes(o.status))throw Error('กดทำเสร็จแล้วก่อนจบรายการ');if(!o.paid){o.paid=true;o.paidAt=now;o.paymentMethod=method;}if(finish)o.status='completed';o.updatedAt=now;return s;}
function cancelOrder(state,id,reason,now=new Date().toISOString()){const s=clone(state),o=orderIn(s,id);if(o.status==='cancelled')return s;if(o.status==='completed')throw Error('รายการเสร็จแล้ว กรุณาตรวจจากประวัติ');const text=String(reason||'').trim().slice(0,200);if(!text)throw Error('ใส่เหตุผลที่ยกเลิกค่ะ');o.status='cancelled';o.cancelReason=text;o.updatedAt=now;if(o.paid)o.refund={status:'required',amount:o.total,createdAt:now,completedAt:null};return s;}
function refundOrder(state,id,now=new Date().toISOString()){const s=clone(state),o=orderIn(s,id);if(o.refund?.status==='completed')return s;if(!o.refund||o.refund.status!=='required')throw Error('รายการนี้ไม่มีเงินที่ต้องคืน');o.refund.status='completed';o.refund.completedAt=now;o.updatedAt=now;return s;}
function totals(state,day=bangkokDate()){const today=state.orders.filter(o=>o.businessDate===day),received=state.orders.filter(o=>o.paidAt&&bangkokDate(o.paidAt)===day).reduce((a,o)=>a+o.total,0),refunded=state.orders.filter(o=>o.refund?.completedAt&&bangkokDate(o.refund.completedAt)===day).reduce((a,o)=>a+o.refund.amount,0),refundDue=state.orders.filter(o=>o.refund?.status==='required').reduce((a,o)=>a+o.refund.amount,0),pending=state.orders.filter(o=>!['completed','cancelled'].includes(o.status)),unpaid=pending.filter(o=>!o.paid).reduce((a,o)=>a+o.total,0);return {day,count:today.filter(o=>o.status!=='cancelled').length,received,refunded,net:received-refunded,refundDue,pendingCount:pending.length,unpaid,newCount:pending.filter(o=>o.status==='new').length,preparingCount:pending.filter(o=>o.status==='preparing').length,readyCount:pending.filter(o=>o.status==='ready').length};}
function closeDay(state,now=new Date().toISOString()){const s=clone(state),summary=totals(s,bangkokDate(now));if(summary.pendingCount)throw Error('ยังมีรายการค้าง '+summary.pendingCount+' รายการ ปิดรับรายการใหม่ก่อนได้');if(summary.refundDue)throw Error('ยังมีเงินที่ต้องคืน กรุณาตรวจให้ครบก่อนจบวัน');s.settings.open=false;s.settings.closedDate=summary.day;const record={...summary,closedAt:now};const old=s.closings.findIndex(c=>c.day===summary.day);if(old<0)s.closings.push(record);else s.closings[old]=record;return s;}
function changeStock(state,key,available){if(!STOCK.some(([id])=>id===key))throw Error('ไม่พบวัตถุดิบนี้');const s=clone(state);s.stock[key]=!!available;return s;}
function stockImpact(state,key){const names=[];for(const d of state.menu.filter(m=>m.active)){if((d.stockKeys||[]).includes(key))names.push(d.name);for(const g of groupsFor(d))for(const v of g.values)if((v.stockKeys||[]).includes(key))names.push(d.name+' · '+v.name);}return [...new Set(names)];}
function openShop(state){if(!state.menu.some(d=>menuReady(state,d)))throw Error('ตั้งราคาและกดเปิดขายอย่างน้อย 1 เมนูก่อนเปิดร้านค่ะ');const s=clone(state);s.settings.open=true;s.settings.closedDate=null;return s;}
const visibleMenu=state=>state.menu.filter(d=>d.active!==false&&d.published===true);
const menuReady=(state,dish)=>dish.published===true&&dishConfigured(state,dish);

function upgradeState(state){
  if(state.version>=2&&state.menu.every(d=>typeof d.published==='boolean'))return state;
  const s=clone(state);
  for(const d of s.menu)if(typeof d.published!=='boolean')d.published=false;
  s.settings.open=false;
  s.version=2;
  return s;
}

function validateDish(state,dish){
  dish.name=String(dish.name||'').trim();
  if(!dish.name||dish.name.length>80)throw Error('ใส่ชื่ออาหารไม่เกิน 80 ตัวอักษร');
  if(!CATEGORIES.some(([id])=>id!=='all'&&id===dish.category))throw Error('เลือกหมวดยำ ส้มตำ อาหารตามสั่ง หรือของทานคู่');
  const normalized=s=>s.trim().replace(/\s+/g,' ').toLocaleLowerCase('th');
  if(state.menu.some(d=>d.id!==dish.id&&d.active!==false&&d.category===dish.category&&normalized(d.name)===normalized(dish.name)))throw Error('ชื่อเมนูนี้มีอยู่แล้วในหมวดนี้ค่ะ');
  for(const key of dish.stockKeys||[])if(!STOCK.some(([id])=>id===key))throw Error('วัตถุดิบไม่ถูกต้อง');
  if(dish.price!==null&&(!Number.isSafeInteger(dish.price)||dish.price<=0))throw Error('ตรวจราคาจานอีกครั้ง');
  for(const g of dish.groups||[])for(const v of g.values)if(v.price!==null&&v.price!==undefined&&(!Number.isSafeInteger(v.price)||v.price<=0))throw Error('ตรวจราคาตัวเลือกอีกครั้ง');
}

function updateDish(state,id,patch){
  const s=clone(state),d=s.menu.find(d=>d.id===id);
  if(!d)throw Error('ไม่พบเมนูนี้');
  const allowed=['name','category','description','recipe','stockKeys','price','groups','available','active','recommended','special','photoKey'];
  for(const key of allowed)if(Object.hasOwn(patch,key))d[key]=clone(patch[key]);
  validateDish(s,d);
  // Editing a name, price, category or photo never publishes a draft.
  if(d.active===false)d.published=false;
  d.updatedAt=new Date().toISOString();
  return s;
}

function addDish(state,input,now=new Date().toISOString()){
  const s=clone(state),id=input.id||'custom-'+uuid();
  if(!/^custom-[0-9a-f-]{36}$/i.test(id))throw Error('รหัสเมนูใหม่ไม่ถูกต้อง');
  if(s.menu.some(d=>d.id===id))return s; // One form owns one creation ID, including retries.
  const dish={id,name:input.name,category:input.category,description:input.description||'',recipe:input.recipe||'',stockKeys:clone(input.stockKeys||[]),price:input.price??null,priceMode:'base',groups:[],active:true,published:false,available:input.available!==false,recommended:!!input.recommended,special:!!input.special,recipeRequired:false,photoKey:input.photoKey||null,custom:true,createdAt:now};
  validateDish(s,dish);
  s.menu.push(dish);
  return s;
}

function publishDish(state,id){
  const s=clone(state),d=s.menu.find(d=>d.id===id);
  if(!d)throw Error('ไม่พบเมนูนี้');
  if(!dishConfigured(s,d))throw Error('ตั้งราคาและตรวจของในจานให้พร้อมก่อนเปิดขายค่ะ');
  d.published=true;
  return s;
}

function unpublishDish(state,id){
  const s=clone(state),d=s.menu.find(d=>d.id===id);
  if(!d)throw Error('ไม่พบเมนูนี้');
  d.published=false;
  return s;
}

const BANNER_SRC = '29210(1).png';
const BANNER_ALT = 'ป้ายร้านเจ๊เล่ส้มตำ รูปแม่พร้อมอาหารตามสั่ง ยำ และส้มตำ';

function escapeAttribute(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function bannerMarkup({owner=false,src=BANNER_SRC}={}){
 const safe=escapeAttribute(src);
 return '<figure class="shop-banner" data-banner-owner="'+owner+'"><button class="shop-banner-open" type="button" data-action="shop-banner" data-banner-src="'+safe+'" aria-label="ดูป้ายร้านเต็มภาพ"><img class="shop-banner-image" src="'+safe+'" width="1942" height="809" alt="'+BANNER_ALT+'" decoding="async"><span class="shop-banner-badge">ดูป้ายเต็ม</span></button><div class="shop-banner-placeholder" hidden><strong>เจ๊เล่ส้มตำ</strong><span>อาหารตามสั่ง · ยำ · ส้มตำ</span><button class="offline-poster-pick" type="button" data-action="choose-banner">ใส่โปสเตอร์ที่ส่งไว้</button><small>เลือกภาพจากเครื่อง แล้วดูเต็มภาพได้ทันที</small></div>'+(owner?'<button type="button" class="shop-banner-change" data-action="choose-banner">เปลี่ยนภาพ</button>':'')+'<input type="file" id="shopBannerUpload" accept="image/jpeg,image/png,image/webp" hidden aria-label="เลือกโปสเตอร์ร้าน"></figure>';
}

function initBannerViewer() {
  if (document.getElementById('shopBannerViewer')) return;
  const dialog = document.createElement('dialog');
  dialog.id = 'shopBannerViewer';
  dialog.className = 'shop-banner-viewer';
  dialog.setAttribute('aria-labelledby', 'shopBannerTitle');
  dialog.innerHTML = [
    '<div class="banner-viewer-head"><div><h2 id="shopBannerTitle">ป้ายร้านเจ๊เล่ส้มตำ</h2><p>อาหารตามสั่ง · ยำ · ส้มตำ</p></div><button type="button" class="banner-viewer-close" data-banner-control="close" aria-label="ปิดภาพป้าย">ปิด</button></div>',
    '<div class="banner-viewer-viewport" tabindex="0" role="region" aria-label="ภาพป้ายร้าน เลื่อนดูได้เมื่อขยาย"><div class="banner-viewer-canvas"><img class="banner-viewer-image" alt="' + BANNER_ALT + '" draggable="false"></div></div>',
    '<p class="banner-viewer-error" role="alert" hidden>ยังเปิดภาพป้ายไม่ได้ กรุณาลองอีกครั้ง</p>',
    '<div class="banner-viewer-tools"><div class="banner-zoom-controls" role="group" aria-label="ขยายภาพป้าย"><button type="button" data-banner-control="minus" aria-label="ย่อภาพ" disabled>−</button><output class="banner-zoom-label" aria-live="polite">พอดีจอ</output><button type="button" data-banner-control="plus" aria-label="ขยายภาพ" disabled>+</button><button type="button" data-banner-control="fit">พอดีจอ</button></div><a class="banner-original-link" href="' + BANNER_SRC + '" target="_blank" rel="noopener">เปิดภาพต้นฉบับ</a></div>'
  ].join('');
  document.body.append(dialog);

  const viewport = dialog.querySelector('.banner-viewer-viewport');
  const canvas = dialog.querySelector('.banner-viewer-canvas');
  const image = dialog.querySelector('.banner-viewer-image');
  const error = dialog.querySelector('.banner-viewer-error');
  const output = dialog.querySelector('output');
  const minus = dialog.querySelector('[data-banner-control="minus"]');
  const plus = dialog.querySelector('[data-banner-control="plus"]');
  let zoom = 1;
  let opener = null;
  let currentSource = BANNER_SRC;

  function applyZoom(value, center = false) {
    if (!image.naturalWidth || !dialog.open) return;
    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;
    if (vw < 1 || vh < 1) return;
    const ratioX = (viewport.scrollLeft + vw / 2) / Math.max(canvas.offsetWidth, vw);
    const ratioY = (viewport.scrollTop + vh / 2) / Math.max(canvas.offsetHeight, vh);
    zoom = Math.max(1, Math.min(4, value));
    const fit = Math.min(Math.max(1, vw - 24) / image.naturalWidth, Math.max(1, vh - 24) / image.naturalHeight, 1);
    const w = Math.max(1, Math.round(image.naturalWidth * fit * zoom));
    const h = Math.max(1, Math.round(image.naturalHeight * fit * zoom));
    const cw = Math.max(vw, w + 24);
    const ch = Math.max(vh, h + 24);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    image.style.width = w + 'px';
    image.style.height = h + 'px';
    viewport.scrollLeft = Math.max(0, (center ? cw / 2 : ratioX * cw) - vw / 2);
    viewport.scrollTop = Math.max(0, (center ? ch / 2 : ratioY * ch) - vh / 2);
    output.textContent = zoom === 1 ? 'พอดีจอ' : Math.round(zoom * 100) + '%';
    minus.disabled = zoom <= 1;
    plus.disabled = zoom >= 4;
  }

  function control(action) {
    if (action === 'close') dialog.close();
    else if (action === 'plus') applyZoom(zoom * 1.5);
    else if (action === 'minus') applyZoom(zoom / 1.5);
    else if (action === 'fit') applyZoom(1, true);
  }

  image.addEventListener('load', () => {
    error.hidden = true;
    applyZoom(1, true);
  });
  image.addEventListener('error', () => {
    error.hidden = false;
    minus.disabled = true;
    plus.disabled = true;
  });
  document.addEventListener('click', event => {
    if(event.target.closest('[data-action="choose-banner"]')){document.getElementById('shopBannerUpload')?.click();return;}
    const trigger = event.target.closest('[data-action="shop-banner"]');
    if (!trigger) return;
    opener = trigger;
    zoom = 1;
    error.hidden = true;
    dialog.showModal();
    document.body.classList.add('banner-viewing');
    const selectedSource=trigger.dataset.bannerSrc||BANNER_SRC;
    dialog.querySelector('.banner-original-link').href=selectedSource;
    if(selectedSource!==currentSource||!image.getAttribute('src')||!image.naturalWidth){currentSource=selectedSource;image.src=selectedSource;}
    else applyZoom(1,true);
  });
  document.addEventListener('error', event => {
    if (event.target.matches?.('.shop-banner-image')) {
      const banner = event.target.closest('.shop-banner');
      if(banner){banner.querySelector('.shop-banner-open').hidden=true;banner.querySelector('.shop-banner-placeholder').hidden=false;const change=banner.querySelector('.shop-banner-change');if(change)change.hidden=true;}
    }
  }, true);
  dialog.addEventListener('click', event => {
    const button = event.target.closest('[data-banner-control]');
    if (button) control(button.dataset.bannerControl);
  });
  dialog.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey) return;
    const action = event.key === '+' || event.key === '=' ? 'plus' : event.key === '-' ? 'minus' : event.key === '0' ? 'fit' : null;
    if (action) {
      event.preventDefault();
      control(action);
    }
  });
  dialog.addEventListener('close', () => {
    document.body.classList.remove('banner-viewing');
    if (opener?.isConnected) opener.focus({preventScroll: true});
  });
  window.addEventListener('resize', () => {
    if (dialog.open) applyZoom(zoom, true);
  });
  window.addEventListener('hashchange', () => {
    if (dialog.open) dialog.close();
  });
}


class PracticeRepository{
 constructor(catalog,profile='jele'){
   this.catalog=catalog;
   this.key='jele:standalone-preview:v1';
   this.listeners=new Set();

function renderMother(){const s=getSummary();const pending=state.orders.filter(o=>!['completed','cancelled'].includes(o.status));const orders=filter==='active'?pending:state.orders.filter(o=>filter==='all'||o.status===filter);orders.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));return `<div class="mother-layout"><section class="mother-main"><div class="mother-toolbar"><div><p class="eyebrow">งานของแม่ · ${day(bangkokDate())}</p><h2>งานวันนี้</h2></div><button class="${state.settings.open?'secondary':'primary'}" data-action="${state.settings.open?'pause':'open'}">${state.settings.open?'พักรับรายการใหม่':'เปิดร้าน'}</button></div>${!state.settings.open?`<div class="notice ${state.menu.some(d=>menuReady(state,d))?'':'warning'}"><strong>ยังไม่เปิดรับรายการ</strong><br>${state.menu.some(d=>menuReady(state,d))?'พร้อมเมื่อไหร่ กดเปิดร้านด้านบนได้เลยค่ะ':'ไปจัดรายชื่อ ตั้งราคา และกดเปิดขายอย่างน้อย 1 เมนูก่อนค่ะ'} <a class="text-button" href="#/mother/pending">จัดเมนูวันนี้</a></div>`:''}<div class="metrics"><div class="metric">${icon('receipt')}<b>${s.newCount??pending.filter(o=>o.status==='new').length}</b><span>รายการใหม่</span></div><div class="metric">${icon('fire')}<b>${s.preparingCount??pending.filter(o=>o.status==='preparing').length}</b><span>กำลังทำ</span></div><div class="metric">${icon('check')}<b>${s.readyCount??pending.filter(o=>o.status==='ready').length}</b><span>พร้อมรับ</span></div></div><div class="tabs" role="group" aria-label="กรองรายการ">${[['active','งานค้าง'],['all','ทั้งหมด'],['completed','เสร็จแล้ว'],['cancelled','ยกเลิก']].map(([id,name])=>`<button class="chip ${filter===id?'selected':''}" data-action="order-filter" data-value="${id}" aria-pressed="${filter===id}">${name}</button>`).join('')}</div>${orders.length?orders.map(o=>orderCard(o)).join(''):empty('ยังไม่มีรายการ'+(filter==='active'?'ค้าง':''),state.settings.open?'เปิดหน้าลูกค้าเพื่อเริ่มฝึกสั่งอาหารได้ค่ะ':'ตั้งราคาและเปิดร้าน แล้วค่อยเริ่มรับรายการค่ะ',`<a class="primary" href="#/menu">ไปหน้าลูกค้า ${icon('arrow')}</a>`)}${mode==='practice'?'<p class="small muted">รายการฝึกในเครื่องเดียวกันแสดงทั้งหน้าลูกค้าและหน้างานแม่ เปิดคนละแท็บเพื่อฝึกพร้อมกันได้</p>':''}</section>${motherAside()}</div>`;}
function savedPrices(d){
  return d.priceMode==='choice'?groupsFor(d)[0]?.values.filter(v=>Number.isInteger(v.price)&&v.price>0).map(v=>({name:v.name,price:v.price}))||[]:Number.isInteger(d.price)&&d.price>0?[{name:'',price:d.price}]:[];

function ownerMenuRow(d,published){
  const prices=savedPrices(d),image=photoUrls.get(d.photoKey),configured=dishConfigured(state,d);
  return `<article class="draft-row" data-id="${esc(d.id)}" data-food="${esc(d.category)}"><div class="draft-main">${image?`<img class="draft-thumb" src="${esc(image)}" alt="${esc(d.name)}">`:`<span class="draft-thumb no-photo">${icon('image')}</span>`}<div class="draft-copy"><h4>${esc(d.name)}</h4><p class="saved-price">${prices.length?prices.map(v=>`${v.name?esc(v.name)+' ':''}${money(v.price)}`).join(' · '):'ยังไม่ได้ตั้งราคา'}</p><div class="draft-tags">${!prices.length?'<span class="badge warn">รอราคา</span>':''}${!image?'<span class="badge">รอภาพ</span>':''}${d.recipeRequired&&(!d.recipe?.trim()||!d.stockKeys?.length)?'<span class="badge warn">รอของในจาน</span>':''}${published?'<span class="badge sale">เปิดขายแล้ว</span>':configured?'<span class="badge ready">ตั้งราคาแล้ว · ยังไม่เปิดขาย</span>':''}</div></div></div><div class="draft-actions"><button class="secondary" data-action="edit" data-id="${esc(d.id)}" aria-label="แก้${esc(d.name)}">แก้ชื่อ / ราคา</button>${published?`<button class="text-button" data-action="unpublish-sheet" data-id="${esc(d.id)}">เก็บไว้รอเปิดขาย</button>`:`<button class="primary" data-action="publish-sheet" data-id="${esc(d.id)}" ${configured?'':'disabled'}>เปิดขาย</button>`}</div></article>`;
}
function renderMotherMenu(){
  const publishedPane=route()[1]==='published',included=state.menu.filter(d=>d.active!==false),pending=included.filter(d=>!d.published),published=included.filter(d=>d.published);
  const allItems=publishedPane?published:pending;
  const items=allItems.filter(d=>(ownerCategory==='all'||d.category===ownerCategory)&&(!ownerSearch.trim()||d.name.includes(ownerSearch.trim())));
  const categories=['yum','som','made','side'];
  const withPhotos=included.filter(d=>photoUrls.has(d.photoKey)).length,photoPercent=included.length?Math.round(withPhotos*100/included.length):0;

  return shopBanner()+photoProgress+`<div class="mother-layout"><section class="mother-main"><div class="mother-toolbar"><div><p class="eyebrow">เมนูของแม่ · แก้ไขและเก็บไว้ได้</p><h2>${publishedPane?'เมนูที่เปิดขาย':'รอเปิดขาย'}</h2></div><button class="primary add-menu-button" data-action="new-dish">${icon('plus')} เพิ่มเมนู</button></div><nav class="menu-panes" aria-label="สถานะเมนู"><a class="${publishedPane?'':'active'}" href="#/mother/pending">รอเปิดขาย <b>${pending.length}</b></a><a class="${publishedPane?'active':''}" href="#/mother/published">เปิดขายแล้ว <b>${published.length}</b></a></nav>${!publishedPane?`<div class="draft-intro"><p>ชื่อและราคาแก้ทีหลังได้<br>ภาพค่อยใส่ เมนูยังอยู่รอเปิดขาย</p><button class="text-button" data-action="catalog">รายชื่อเพิ่มเติม</button></div>`:''}<div class="owner-categories" role="group" aria-label="หมวดเมนูของแม่">${[['all','ทั้งหมด'],...categories.map(id=>[id,THEMES[id].name])].map(([id,name])=>`<button data-action="owner-category" data-value="${id}" aria-pressed="${ownerCategory===id}">${name}</button>`).join('')}</div><details class="draft-search" ${ownerSearch.trim()?'open':''}><summary>${icon('search')} ค้นหารายชื่อ</summary><label class="search"><input type="search" id="ownerSearch" value="${esc(ownerSearch)}" placeholder="ค้นหาชื่อเมนู" aria-label="ค้นหาเมนูของแม่"></label></details><div class="draft-groups">${categories.filter(id=>ownerCategory==='all'||ownerCategory===id).map(id=>{const group=items.filter(d=>d.category===id),theme=THEMES[id];if(publishedPane&&!group.length)return '';return `<section class="draft-group" data-food="${id}" aria-label="${esc(theme.name)}${publishedPane?'ที่เปิดขาย':'รอเปิดขาย'}"><div class="draft-group-head"><div><h3>${esc(theme.name)}</h3><span>${group.length} เมนู</span></div><button class="add-to-group" data-action="new-dish" data-category="${id}">${icon('plus')} เพิ่ม${esc(theme.short)}</button></div>${group.length?group.map(d=>ownerMenuRow(d,publishedPane)).join(''):`<p class="draft-empty">${ownerSearch?'ไม่พบชื่อนี้ในหมวดนี้':publishedPane?'ยังไม่มีเมนูเปิดขาย':'กดเพิ่มเพื่อเก็บรายชื่อในหมวดนี้'}</p>`}</section>`;}).join('')}${publishedPane&&!items.length?empty('ยังไม่มีเมนูเปิดขาย','เลือกเมนูจากหน้ารอเปิดขายเมื่อพร้อมค่ะ','<a class="primary" href="#/mother/pending">ไปหน้ารอเปิดขาย</a>'):''}</div>${publishedPane&&mode==='practice'?`<details class="stock-details"><summary>ของที่มีขายวันนี้</summary><div class="stock-grid">${STOCK.map(([key,name])=>`<div class="stock-item"><div>${name}<small>${state.stock[key]!==false?'มีขาย':'หมดวันนี้'}</small></div><button class="switch ${state.stock[key]!==false?'on':''}" role="switch" aria-checked="${state.stock[key]!==false}" aria-label="${esc(name)} ${state.stock[key]!==false?'มีขาย':'หมดวันนี้'}" data-action="stock" data-key="${key}"></button></div>`).join('')}</div></details>`:''}</section><aside class="mother-aside"><h3>เพิ่มเมนูตามที่แม่ขาย</h3><div class="step"><b>1</b><span>กดเพิ่มเมนู<br>ตั้งชื่อและเลือกหมวด</span></div><div class="step"><b>2</b><span>ใส่ราคาเมื่อพร้อม<br>ภาพค่อยใส่ทีหลังได้</span></div><div class="step"><b>3</b><span>บันทึกรอเปิดขาย<br>กดเปิดขายเมื่ออยากให้สั่งได้</span></div><a class="side-link" href="#/help">วิธีใช้งาน ${icon('help')}</a></aside></div>`;
}
function renderSummary(){
  const s=getSummary(),pending=state.orders.filter(o=>!['completed','cancelled'].includes(o.status));
  return `<div class="mother-layout"><section class="mother-main">${intro('ยอดวันนี้','นับจากรายการที่รับเงินจริงแล้ว','งานของแม่ · '+day(bangkokDate()))}<div class="summary-grid"><div class="summary-box major">${icon('cash')}<h3>รับเงินสุทธิวันนี้</h3><b>${money(s.net)}</b><div class="summary-receipt-foot"><span>รับเงินแล้ว หักเงินที่คืนแล้ว</span><span class="receipt-stamp">${icon('check')} ${mode==='practice'?'ยอดฝึกในเครื่อง':'ยอดของร้าน'}</span></div></div><div class="summary-box received">${icon('receipt')}<h3>รับเงินแล้ว</h3><b>${money(s.received)}</b></div><div class="summary-box refunded">${icon('undo')}<h3>คืนเงินแล้ว</h3><b>${money(s.refunded)}</b></div><div class="summary-box pending">${icon('list')}<h3>รายการค้าง</h3><b>${s.pendingCount} รายการ</b></div><div class="summary-box unpaid">${icon('clock')}<h3>ยังไม่ได้รับเงิน</h3><b>${money(s.unpaid)}</b></div></div>${s.refundDue?`<div class="notice error">ยังมีเงินที่ต้องคืน ${money(s.refundDue)}<br>เปิดรายการยกเลิกเพื่อตรวจและบันทึกคืนเงินจริง</div>`:''}<div class="guide closing-guide"><h3>ก่อนจบวันนี้</h3><p>${pending.length?'ยังมีงานค้าง '+pending.length+' รายการ ตรวจให้ครบก่อนค่ะ':'ไม่มีรายการค้างแล้ว ตรวจยอดเงินก่อนจบวันได้ค่ะ'}</p><div class="actions"><button class="secondary" data-action="pause">ปิดรับรายการใหม่</button><button class="primary" data-action="close-day">จบวัน ${icon('check')}</button></div></div>${state.closings.length?`<div class="section-label"><h2>วันที่เก็บยอดแล้ว</h2></div>${[...state.closings].sort((a,b)=>b.day.localeCompare(a.day)).map(c=>`<div class="closing-row"><span>${day(c.day)}</span><b>${money(c.net??c.received)}</b></div>`).join('')}`:''}</section>${motherAside()}</div>`;
}
function renderHelp(){return intro('ใช้ทีละขั้น ตามงานของแม่','เริ่มจากอาหารหนึ่งจาน แล้วค่อยลองสถานการณ์อื่น','วิธีใช้')+`<div class="help-layout"><section><article class="guide"><h3>ก่อนเริ่มครั้งแรก</h3><div class="guide-step"><span>1</span><div><h4>เพิ่มชื่อและเลือกหมวดอาหาร</h4><p>ไปเมนู → รอเปิดขาย → เพิ่มเมนู ตั้งชื่อ เลือกหมวด แล้วบันทึก แก้ชื่อ ย้ายหมวด ใส่ราคา หรือใส่ภาพทีหลังได้</p></div></div><div class="guide-step"><span>2</span><div><h4>กดเปิดร้าน</h4><p>เมื่อจานที่อยากลองมีราคาแล้ว กดเปิดขายจากหน้ารอ จากนั้นไปงานวันนี้ กดเปิดร้าน แล้วฝึกสั่งจากหน้าลูกค้า</p></div></div><div class="guide-step"><span>3</span><div><h4>กลับมาทำรายการของแม่</h4><p>แม่อ่านอาหาร เนื้อ จำนวน และข้อความที่ฝากไว้ แล้วกดทีละขั้น</p></div></div><div class="guide-buttons"><div>เริ่มทำ</div><div>ทำเสร็จแล้ว</div><div>รับเงินแล้ว</div></div><p class="small">กดรับเงินหลังได้รับเงินจริง ถ้าฝึกอยู่ รายการและยอดเงินเป็นข้อมูลฝึกในเครื่องนี้ค่ะ</p><a class="primary" href="#/mother/pending">เริ่มตั้งเมนู ${icon('arrow')}</a></article><article class="guide"><h3>เปลี่ยนภาพและของในจาน</h3><p>หน้าเมนู → แก้ไข → เลือกภาพ → ดูภาพก่อนใช้ → บันทึก แม่เอารูปออกหรือเปลี่ยนใหม่ได้ ชื่ออาหารกับราคายังอ่านได้แม้ยังไม่มีรูป</p><p>จานรวมให้แม่บอกของที่รวมและเลือกวัตถุดิบที่ใช้ เพื่อให้ปิดของหมดได้ตรงจาน</p></article><article class="guide"><h3>ลองให้ครบก่อนใช้ประจำ</h3><div class="guide-step"><span>1</span><div><h4>สั่งหนึ่งจาน แล้วสั่งหลายจาน</h4><p>ดูว่าจำนวน ตัวเลือก ความเผ็ด และข้อความตรงกันทั้งสองหน้า</p></div></div><div class="guide-step"><span>2</span><div><h4>ลองของหมดและยกเลิก</h4><p>ปิดกุ้งแล้วตรวจจานที่ใช้กุ้ง รายการที่ส่งมาแล้วไม่หาย ยกเลิกต้องมีเหตุผล</p></div></div><div class="guide-step"><span>3</span><div><h4>ลองรับเงินซ้ำและปิดวัน</h4><p>ยอดรับเงินไม่เพิ่มซ้ำ รายการค้างยังเห็นอยู่ และจบวันเมื่อเคลียร์งานครบแล้ว</p></div></div></article><article class="guide"><h3>พื้นที่ของร้าน</h3><p>${mode==='practice'?'ตอนนี้กำลังฝึกในเครื่องนี้ ข้อมูลไม่ส่งเข้าร้านจริงและไม่ปนกับร้านคุณยุ้ย':'ตอนนี้เชื่อมข้อมูลร้านเจ๊เล่กับระบบกลาง การเปลี่ยนแปลงมีผลกับร้านจริง'}</p>${mode==='practice'?`<button class="secondary" data-action="live-info">ดูสถานะการเชื่อมร้านจริง</button> <button class="text-button" data-action="reset-practice">เริ่มข้อมูลฝึกใหม่</button>`:`<button class="secondary" data-action="practice-mode">กลับพื้นที่ฝึก</button> <button class="text-button" data-action="logout">ออกจากงานร้าน</button>`}</article></section><aside class="mother-aside"><h3>ลองด้วยราคาที่แม่กรอก</h3><p>ไม่มีราคาตั้งให้ล่วงหน้า แม่เลือกตั้งเฉพาะจานที่อยากลองก่อน แล้วค่อยเพิ่มจานอื่นค่ะ</p><a class="side-link" href="#/menu">ไปหน้าลูกค้า ${icon('arrow')}</a><a class="side-link" href="#/mother">ไปงานวันนี้ ${icon('arrow')}</a><a class="side-link" href="#/mother/pending">หน้าจัดเมนู ${icon('arrow')}</a></aside></div>`;}
function customerOrders(){const orders=state.orders.filter(o=>mode==='live'||o.customerId===customerId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));return intro('รายการที่ฉันสั่ง','ตรวจชื่ออาหารและดูสถานะรับอาหาร')+(orders.length?`<div class="narrow">${orders.map(o=>orderCard(o,{customer:true})).join('')}</div>`:empty('ยังไม่มีรายการ','เลือกอาหารแล้วตรวจตะกร้าก่อนส่งค่ะ','<a class="primary" href="#/menu">เลือกเมนู</a>'));}
function tracking(id){const o=state.orders.find(o=>o.id===id&&(mode==='live'||o.customerId===customerId));if(!o)return empty('ยังไม่พบรายการนี้','เปิดรายการที่ฉันสั่งเพื่อตรวจอีกครั้งค่ะ','<a class="primary" href="#/orders">ดูรายการที่ฉันสั่ง</a>');const statuses=['new','preparing','ready','completed'];return `<div class="narrow"><a class="back-link" href="#/orders">${icon('back')} รายการที่ฉันสั่ง</a><div class="back-order"><p class="eyebrow">${mode==='practice'?'รายการฝึก':'รายการของคุณ'}</p><div class="big-code">${esc(o.code)}</div><span class="order-status ${o.status}">${STATUS[o.status]}</span>${o.status==='cancelled'?`<p class="muted" style="margin-top:20px">${esc(o.cancelReason||'ร้านยกเลิกรายการนี้')}</p>`:`<div class="timeline">${statuses.map((st,i)=>`<div class="station ${statuses.indexOf(o.status)>=i?'active':''}"><span>${statuses.indexOf(o.status)>i?icon('check'):i+1}</span><div>${['รับรายการแล้ว','แม่กำลังทำ','พร้อมรับอาหาร','ส่งอาหารและจบรายการแล้ว'][i]}</div></div>`).join('')}</div>`}</div><div class="order-card">${orderLines(o)}<div class="order-total"><span>${o.paid?'รับเงินแล้ว':'ชำระที่ร้าน'}</span><b>${money(o.total)}</b></div></div><p class="small muted">แจ้งรหัสรายการกับแม่ และตรวจอาหารก่อนรับกลับค่ะ</p><a class="primary wide" href="#/menu">กลับไปเลือกอาหาร</a></div>`;}
function bottom(){if(isMother()){const r=['pending','published'].includes(route()[1])?'menu':route()[1]||'orders';return `<nav class="bottom-nav" aria-label="งานของแม่">${[['menu','หน้าหลักและเมนู','home'],['orders','ออเดอร์','list'],['summary','ยอดวันนี้','cash']].map(([id,name,ic])=>`<a class="${r===id?'active':''}" href="${id==='orders'?'#/mother':id==='menu'?'#/mother/pending':path(id)}">${icon(ic)}${name}</a>`).join('')}</nav>`;}if(route()[0]==='help')return '';if(cart.length){const lines=currentLines(),valid=lines.every(x=>x.line),total=lines.reduce((s,x)=>s+(x.line?.total||0),0);return `<div class="cart-dock"><button data-action="cart"><span>ดูตะกร้า <small>${cart.reduce((a,l)=>a+l.qty,0)} จาน</small></span><b>${valid?money(total):'ตรวจรายการ'}</b>${icon('arrow')}</button></div>`;}return'';}
function render(){if(!state)return;document.body.dataset.shopView=isMother()?'mother':'customer';const r=route();let html;if(r[0]==='mother')html=(['menu','pending','published'].includes(r[1])?renderMotherMenu():r[1]==='summary'?renderSummary():renderMother());else if(r[0]==='help')html=renderHelp();else if(r[0]==='orders')html=customerOrders();else if(r[0]==='track')html=tracking(r[1]);else html=renderMenu();$('#app').innerHTML=html;$('#bottomArea').innerHTML=bottom();$('#cartCount').textContent=cart.reduce((a,l)=>a+l.qty,0);$('#modeBand').textContent=mode==='practice'?'ไฟล์ทดลองดูหน้าตา · กดบันทึกไฟล์เพื่อเก็บการแก้ไข':'ร้านเจ๊เล่ · เชื่อมระบบกลางแล้ว';document.querySelectorAll('[data-role-tab]').forEach(a=>a.classList.toggle('active',a.dataset.roleTab===(isMother()?'mother':r[0]==='help'?'help':'customer')));hydrate();}
function showDish(id){const d=visibleMenu(state).find(x=>x.id===id);if(!d)return;currentDish=d;dishQty=1;const groups=groupsFor(d);const image=photoUrls.get(d.photoKey);sheet(d.name,`<form id="dishForm"><div class="sheet-body">${image?`<img class="dish-sheet-image" src="${esc(image)}" alt="${esc(d.name)}">`:''}${d.recipe||d.description?`<p class="muted small">${esc(d.recipe||d.description)}</p>`:''}${!menuReady(state,d)?`<div class="notice warning">${d.available===false||!isAllStock(d)?'เมนูนี้หมดชั่วคราวค่ะ':'เมนูนี้ยังไม่พร้อมรับรายการ รอแม่กำหนดราคาและของที่ขายค่ะ'}</div>`:''}${groups.map((g,gi)=>`<fieldset class="option-group"><legend>${esc(g.name)} <small>${g.min||g.required?'ต้องเลือก':'ไม่บังคับ'}${g.max===1?' 1 อย่าง':''}</small></legend><div class="options">${g.values.map(v=>{const available=choiceAvailable(state,v)&&(d.priceMode!=='choice'||gi!==0||Number.isInteger(v.price));return `<label class="option"><span><input type="${g.max===1?'radio':'checkbox'}" name="group-${esc(g.id)}" value="${esc(v.id)}" ${available?'':'disabled'}> ${esc(v.name)}<small>${d.priceMode==='choice'&&gi===0?money(v.price):(v.delta?'เพิ่ม '+money(v.delta):'ไม่คิดเพิ่ม')}${!choiceAvailable(state,v)?' · หมด':''}</small></span></label>`;}).join('')}</div></fieldset>`).join('')}${d.category!=='side'?`<fieldset class="option-group"><legend>ความเผ็ด</legend><div class="options">${['ไม่เผ็ด','เผ็ดน้อย','เผ็ดกลาง','เผ็ดมาก'].map(n=>`<label class="option"><span><input type="radio" name="spice" value="${n}" ${n==='เผ็ดน้อย'?'checked':''}> ${n}</span></label>`).join('')}</div></fieldset>`:''}<label class="field">ฝากบอกแม่ <small>ไม่บังคับ</small><textarea name="note" maxlength="200" placeholder="เช่น ไม่หวาน"></textarea></label><p class="form-error" id="dishError" role="alert"></p></div></form>`,{sub:CATEGORIES.find(([c])=>c===d.category)?.[1],footer:`<div class="quantity"><button data-action="qty-minus" type="button" aria-label="ลดจำนวน">−</button><output id="dishQty">1</output><button data-action="qty-plus" type="button" aria-label="เพิ่มจำนวน">+</button></div><button class="primary" type="submit" form="dishForm" ${menuReady(state,d)?'':'disabled'}>ใส่ตะกร้า <span id="dishTotal">${d.priceMode==='choice'?'เลือกตัวเลือกก่อน':money(d.price)}</span></button>`});}
function selectedDish(){const selected=[...$('#dishForm').querySelectorAll('input[name^="group-"]:checked')].map(x=>x.value);return {dishId:currentDish.id,selected,qty:dishQty,note:$('#dishForm [name="note"]').value,spice:$('#dishForm [name="spice"]:checked')?.value||''};}
function dishTotal(){if(!currentDish||!$('#dishForm'))return;try{const l=lineFor(state,currentDish.id,selectedDish());$('#dishTotal').textContent=money(l.total);}catch{$('#dishTotal').textContent='เลือกตัวเลือกก่อน';}$('#dishQty').textContent=dishQty;}
function showCart(){const rows=currentLines(),valid=rows.every(x=>x.line),total=rows.reduce((a,x)=>a+(x.line?.total||0),0);if(!rows.length)return sheet('ตะกร้าของฉัน',`<div class="sheet-body">${empty('ยังไม่มีอาหารในตะกร้า','เลือกจานที่อยากทานก่อนค่ะ','<button class="primary" data-action="close">ไปเลือกอาหาร</button>')}</div>`);sheet('ตะกร้าของฉัน',`<form id="cartForm"><div class="sheet-body">${rows.map((x,i)=>`<div class="cart-row"><div class="row-top"><h3>${esc(x.line?.name||x.dish?.name||'รายการเดิม')}</h3><b>${x.line?money(x.line.total):'ตรวจรายการ'}</b></div><p>${esc([...(x.line?.optionNames||[]),x.input.spice,x.input.note].filter(Boolean).join(' · '))}</p>${x.error?`<p class="form-error">${esc(x.error)}</p>`:''}<div class="row-bottom"><div class="quantity"><button type="button" data-action="cart-minus" data-index="${i}" aria-label="ลด${esc(x.line?.name||'รายการ')}">−</button><output>${x.input.qty}</output><button type="button" data-action="cart-plus" data-index="${i}" aria-label="เพิ่ม${esc(x.line?.name||'รายการ')}">+</button></div><button type="button" class="text-button" data-action="cart-remove" data-index="${i}">ลบ</button></div></div>`).join('')}<div class="cart-summary"><span>ยอดรวม</span><b>${valid?money(total):'ตรวจรายการก่อน'}</b></div><fieldset class="option-group"><legend>รับอาหารแบบไหน</legend><div class="options"><label class="option"><span><input type="radio" name="fulfillment" value="dine_in" checked> ทานที่ร้าน</span></label><label class="option"><span><input type="radio" name="fulfillment" value="takeaway"> กลับบ้าน</span></label></div></fieldset>${!state.settings.open?'<div class="notice warning">แม่ยังไม่เปิดรับรายการค่ะ</div>':''}<p class="small muted">${mode==='practice'?'รายการนี้เป็นการฝึกในเครื่อง ไม่ส่งเข้าร้านจริง':'ชำระเงินที่ร้าน ตรวจรายการก่อนกดยืนยัน'}</p><p class="form-error" id="cartError" role="alert"></p></div></form>`,{footer:`<button class="primary" type="submit" form="cartForm" ${valid&&state.settings.open?'':'disabled'}>ตรวจรายการก่อนส่ง ${icon('arrow')}</button>`});}
function confirmCart(fulfillment){const rows=currentLines();if(rows.some(x=>!x.line))throw Error('ตรวจเมนูและราคาที่เปลี่ยนในตะกร้าก่อนค่ะ');const sum=rows.reduce((a,x)=>a+x.line.total,0);sheet('ยืนยันรายการนี้',`<div class="sheet-body"><p class="eyebrow">${fulfillment==='dine_in'?'ทานที่ร้าน':'กลับบ้าน'}</p>${rows.map(x=>`<div class="order-line"><div><h4>${esc(x.line.name)} ${x.line.qty} จาน</h4><p>${esc([...x.line.optionNames,x.line.spice,x.line.note].filter(Boolean).join(' · '))}</p></div><strong>${money(x.line.total)}</strong></div>`).join('')}<div class="cart-summary"><span>ยอดรวม</span><b>${money(sum)}</b></div><p class="small muted">${mode==='practice'?'เมื่อส่งแล้ว ให้กลับไปงานของแม่เพื่อฝึกทำรายการนี้':'แม่จะได้รับรายการเมื่อบันทึกสำเร็จ ชำระเงินที่ร้านค่ะ'}</p><p id="sendError" class="form-error" role="alert"></p></div>`,{footer:`<button class="secondary" data-action="cart">กลับไปแก้</button><button class="primary" data-action="send" data-fulfillment="${fulfillment}">ยืนยันส่งรายการ</button>`});}
async function sendOrder(fulfillment,button){if(busy)return;busy=true;button.disabled=true;let requestId;try{requestId=localStorage.getItem('jele:'+mode+':request')||offlineUuid();localStorage.setItem('jele:'+mode+':request',requestId);}catch{requestId=offlineUuid();}try{const input={requestId,fulfillment,customerId,lines:clone(cart)};let id;if(mode==='practice'){let order;state=await repo.update(old=>{const result=createOrder(old,input);order=result.order;return result.state;});id=order.id;}else{id=await repo.create(input);await reload({renderPage:false});}cart=[];saveCart();closeSheet();go('#/track/'+encodeURIComponent(id));toast(mode==='practice'?'ส่งรายการฝึกแล้ว กลับไปงานของแม่ได้เลยค่ะ':'ส่งรายการเข้าร้านแล้ว');}catch(e){const el=$('#sendError');if(el)el.textContent=friendly(e);else toast(friendly(e));button.disabled=false;}finally{busy=false;render();}}

  const d=existing||{id:'custom-'+uuid(),name:'',category:initialCategory||'',description:'',recipe:'',stockKeys:[],price:null,priceMode:'base',groups:[],active:true,published:false,available:true,recommended:false,special:false,photoKey:null};

ype="hidden" name="removePhoto" value="0"></div><details class="editor-details" ${d.recipeRequired?'open':''}><summary>รายละเอียดจานและของที่ใช้</summary>${mode==='practice'?`<label class="field">${d.recipeRequired?'ของที่รวมในจาน ต้องระบุก่อนเปิดขาย':'ของในจานหรือคำอธิบายสูตร'}<textarea name="recipe" maxlength="250" rows="2" placeholder="บอกของที่รวมตามสูตรแม่">${esc(d.recipe)}</textarea></label><div class="recipe-checks">${STOCK.map(([key,name])=>`<label><input type="checkbox" name="stockKeys" value="${key}" ${(d.stockKeys||[]).includes(key)?'checked':''}>${name}</label>`).join('')}</div>`:''}<label class="control-row"><span>มีของพร้อมทำ</span><input type="checkbox" name="available" ${d.available!==false?'checked':''}></label><label class="control-row"><span>เป็นจานแนะนำ</span><input type="checkbox" name="recommended" ${d.recommended?'checked':''}></label>${mode==='practice'?`<label class="control-row"><span>เป็นเมนูพิเศษ</span><input type="checkbox" name="special" ${d.special?'checked':''}></label>`:''}</details><p class="form-error" id="editError" role="alert"></p></div></form>`,{footer:`<button class="secondary" data-action="close">ย้อนกลับ</button><button class="primary" type="submit" form="editForm">${d.published?'บันทึกเมนู':'บันทึกรอเปิดขาย'}</button>`});

async function saveEdit(form,button){
  if(busy||editSaving)return;
  editSaving=true;const originalLabel=button.textContent;button.disabled=true;button.textContent='กำลังบันทึก…';
  try{
    const d=currentEdit,fd=new FormData(form),groups=clone(d.groups||[]),isNew=form.dataset.new==='true';
    for(let gi=0;gi<groups.length;gi++)for(const v of groups[gi].values){const key=d.priceMode==='choice'&&gi===0?'price':'delta';v[key]=parseBaht(fd.get('option-'+v.id),{allowZero:key==='delta'});if(key==='delta'&&v.delta===null)throw Error('ใส่ราคาเพิ่ม หรือใส่ 0 เมื่อไม่คิดเพิ่ม');}
    const patch={name:String(fd.get('name')||'').trim(),category:String(fd.get('category')||''),description:String(fd.get('description')||'').trim(),price:d.priceMode==='choice'?null:parseBaht(fd.get('price')),groups,available:fd.has('available'),recommended:fd.has('recommended'),special:fd.has('special'),active:true};
    if(mode==='practice'){patch.recipe=String(fd.get('recipe')||'').trim().slice(0,250);patch.stockKeys=fd.getAll('stockKeys');if(isNew)addDish(state,{...patch,id:d.id});else updateDish(state,d.id,patch);}
    if(fd.get('removePhoto')==='1')patch.photoKey=null;
    if(draftPhoto)patch.photoKey=await repo.savePhoto(d.id,draftPhoto);
    const ok=await mutate(isNew?'add-dish':'dish',{id:d.id,patch:isNew?{...patch,id:d.id}:patch});
    if(ok){closeSheet();if(isNew||!d.published){ownerCategory=patch.category;go('#/mother/pending');render();}toast(d.published?'บันทึกเมนูแล้วค่ะ':'บันทึกรายชื่อรอเปิดขายแล้วค่ะ');}
    else if(document.getElementById('editError'))document.getElementById('editError').textContent='ยังไม่ได้บันทึก ตรวจข้อความแจ้งด้านบนแล้วลองอีกครั้งค่ะ';
  }catch(e){if(document.getElementById('editError'))document.getElementById('editError').textContent=friendly(e);}
  finally{editSaving=false;if(button.isConnected){button.disabled=false;button.textContent=originalLabel;}}
}
function publishSheet(id){
  const d=state.menu.find(d=>d.id===id);
  if(!d||!dishConfigured(state,d))return toast('ตั้งราคาและตรวจของในจานให้พร้อมก่อนค่ะ');
  sheet('เปิดขายเมนูนี้',`<div class="sheet-body"><h3>${esc(d.name)}</h3><p>${esc(THEMES[d.category].name)}</p><p class="saved-price">${savedPrices(d).map(v=>`${v.name?esc(v.name)+' ':''}${money(v.price)}`).join(' · ')}</p><p>เมื่อยืนยัน เมนูนี้จะแสดงในหน้าลูกค้า ${mode==='practice'?'ของพื้นที่ฝึกนี้':'ของร้านเจ๊เล่'} และสั่งได้เมื่อเปิดร้านค่ะ</p></div>`,{footer:`<button class="secondary" data-action="close">เก็บรอไว้ก่อน</button><button class="primary" data-action="publish-confirm" data-id="${esc(id)}">ยืนยันเปิดขาย</button>`});
}
function unpublishSheet(id){const d=state.menu.find(d=>d.id===id);if(!d)return;sheet('เก็บเมนูไว้รอเปิดขาย',`<div class="sheet-body"><h3>${esc(d.name)}</h3><p>ชื่อ ราคา และภาพยังอยู่ครบ รายการที่ลูกค้าสั่งมาแล้วจะยังอยู่ค่ะ</p></div>`,{footer:`<button class="secondary" data-action="close">กลับไปก่อน</button><button class="primary" data-action="unpublish-confirm" data-id="${esc(id)}">ยืนยันเก็บรอเปิดขาย</button>`});}
function showCatalog(){if(mode==='live')return sheet('รายชื่อในร้านจริง',`<div class="sheet-body"><p>รายชื่อเพิ่มเติมต้องผูกกับหมวดและร้านเจ๊เล่ในระบบกลางก่อนค่ะ</p></div>`);catalogSearch='';sheet('เลือกรายชื่อเพิ่มเติม',`<div class="sheet-body"><p class="small muted">รายชื่ออาหารเพิ่มเติมสำหรับเลือกเก็บไว้ เมนูที่เพิ่มจะยังอยู่ในหน้ารอเปิดขายค่ะ</p><label class="search">${icon('search')}<input type="search" id="catalogSearch" placeholder="ค้นหาชื่ออาหาร" aria-label="ค้นหาอาหารที่จะเพิ่ม"></label><div id="catalogRows">${catalogRows()}</div></div>`);}
function catalogRows(){const list=state.menu.filter(d=>!d.active&&(!catalogSearch||d.name.includes(catalogSearch)));return list.length?list.map(d=>`<div class="setting-row"><div class="setting-text"><h3>${esc(d.name)}</h3><p>${CATEGORIES.find(([id])=>id===d.category)?.[1]}</p></div><button class="secondary" data-action="catalog-add" data-id="${esc(d.id)}">เพิ่มเมนูนี้</button></div>`).join(''):empty('ไม่พบเมนูเพิ่ม','ลองค้นชื่อสั้นลงได้ค่ะ');}
function stockSheet(key){const available=state.stock[key]===false,name=STOCK.find(([id])=>id===key)?.[1],impacts=stockImpact(state,key);sheet(available?'กลับมาขาย'+name:name+'หมดวันนี้',`<div class="sheet-body"><p>${available?'เมนูที่ผูกวัตถุดิบนี้จะกลับมาสั่งได้ เมื่อราคาและของอื่นพร้อม':'ปิดเฉพาะเมนูหรือตัวเลือกที่ผูกวัตถุดิบนี้ไว้ รายการที่สั่งแล้วจะยังอยู่'}</p><h3 class="small">เมนูและตัวเลือกที่ได้รับผล</h3>${impacts.length?`<ul class="small">${impacts.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:'<p class="small muted">ยังไม่มีเมนูที่ผูกวัตถุดิบนี้</p>'}<p class="small muted">ตรวจจานรวมให้แม่ระบุของที่ใช้ก่อนเปิดขายเสมอค่ะ</p></div>`,{footer:`<button class="secondary" data-action="close">ยังไม่เปลี่ยน</button><button class="primary" data-action="stock-confirm" data-key="${key}" data-available="${available}">${available?'กลับมาขาย':'ปิดของที่หมด'}</button>`});}
function showPayment(id,finish=true){const o=state.orders.find(x=>x.id===id);if(!o)return;sheet(o.paid?'ส่งอาหารครบแล้ว':'รับเงินรายการ '+o.code,`<form id="payForm" data-id="${esc(id)}" data-finish="${finish}"><div class="sheet-body">${orderLines(o)}<div class="cart-summary"><span>${o.paid?'รับเงินแล้ว':'ยอดที่ต้องรับ'}</span><b>${money(o.total)}</b></div>${o.paid?'<p>ตรวจอาหารให้ครบแล้วจบการส่งมอบได้เลย ไม่เพิ่มรายรับซ้ำค่ะ</p>':`<label class="field">รับเงินแบบไหน<select name="method"><option value="cash">เงินสด</option><option value="promptpay_qr">สแกนจ่ายหน้าร้าน</option></select></label><p class="small">ตรวจว่าได้รับเงินจริงแล้วก่อนกดยืนยันค่ะ</p>`}<p class="form-error" id="payError" role="alert"></p></div></form>`,{footer:`<button class="secondary" data-action="close">ย้อนกลับ</button><button class="primary" type="submit" form="payForm">${o.paid?'ยืนยันส่งอาหารแล้ว':finish?'ยืนยันรับเงินและจบรายการ':'ยืนยันรับเงินก่อน'}</button>`});}
function orderMore(id){const o=state.orders.find(x=>x.id===id);if(!o)return;sheet('เพิ่มเติม '+o.code,`<div class="sheet-body">${!o.paid?`<button class="secondary wide" style="margin-bottom:13px" data-action="prepay" data-id="${esc(id)}">รับเงินไว้ก่อน</button>`:''}<button class="secondary wide" style="margin-bottom:13px" data-action="sold-out" data-id="${esc(id)}">แจ้งของหมดในรายการนี้</button><button class="text-button wide" style="color:var(--red)" data-action="cancel-sheet" data-id="${esc(id)}">ยกเลิกรายการ</button></div>`);}
function cancelSheet(id){const o=state.orders.find(x=>x.id===id);if(!o)return;sheet('ยกเลิกรายการ '+o.code,`<form id="cancelForm" data-id="${esc(id)}"><div class="sheet-body">${o.paid?`<div class="notice warning">รายการนี้รับเงินแล้ว ${money(o.total)} เมื่อยกเลิกจะมีงานคืนเงินค้างให้ตรวจค่ะ</div>`:''}<label class="field">เหตุผลที่ยกเลิก<textarea name="reason" maxlength="200" required placeholder="เช่น กุ้งหมด ลูกค้าเลือกเปลี่ยนเมนู"></textarea></label><p class="small muted">ลูกค้าจะเห็นเหตุผลนี้ค่ะ</p><p id="cancelError" class="form-error" role="alert"></p></div></form>`,{footer:`<button class="secondary" data-action="close">ไม่ยกเลิก</button><button class="danger" type="submit" form="cancelForm">ยืนยันยกเลิก</button>`});}
function refundSheet(id){const o=state.orders.find(x=>x.id===id);if(!o?.refund)return;sheet('บันทึกคืนเงินแล้ว',`<div class="sheet-body"><p>รายการ ${esc(o.code)}</p><div class="cart-summary"><span>เงินที่ต้องคืน</span><b>${money(o.refund.amount)}</b></div><p>กดเมื่อคืนเงินให้ลูกค้าจริงแล้วเท่านั้นค่ะ</p></div>`,{footer:`<button class="secondary" data-action="close">ยังไม่คืน</button><button class="primary" data-action="refund-confirm" data-id="${esc(id)}">ยืนยันคืนเงินแล้ว</button>`});}
function closeDaySheet(){const s=getSummary();sheet('ตรวจยอดก่อนจบวัน',`<div class="sheet-body"><div class="closing-row"><span>รับเงินแล้ว</span><b>${money(s.received)}</b></div><div class="closing-row"><span>คืนเงินแล้ว</span><b>${money(s.refunded)}</b></div><div class="closing-row"><span>รับเงินสุทธิ</span><b>${money(s.net)}</b></div><div class="closing-row"><span>รายการค้าง</span><b>${s.pendingCount} รายการ</b></div>${s.refundDue?`<div class="notice warning">ยังมีเงินที่ต้องคืน ${money(s.refundDue)}</div>`:''}<p class="small muted" style="margin-top:19px">ปิดรับรายการใหม่และเก็บยอดไว้ดูย้อนหลัง วันถัดไปแม่กดเปิดร้านเมื่อพร้อมค่ะ</p>${s.pendingCount?'<p class="form-error">ยังจบวันไม่ได้ ตรวจรายการค้างให้ครบก่อนค่ะ</p>':''}</div>`,{footer:`<button class="secondary" data-action="close">กลับไปตรวจ</button><button class="primary" data-action="close-confirm" ${s.pendingCount||s.refundDue?'disabled':''}>ยืนยันจบวัน</button>`});}
function liveInfo(){sheet('ไฟล์ทดลองหน้าร้าน', '<div class="sheet-body"><p>เปิดดูหน้าตา เพิ่มเมนู ใส่ราคา และเลือกภาพจากเครื่องได้ค่ะ</p><p>เมื่อแก้แล้ว กดบันทึกไฟล์พร้อมภาพด้านบน เพื่อเก็บงานเป็นไฟล์เดียว เปิดต่อได้ภายหลัง</p><a class="primary wide" href="#/mother/pending" data-action="navigate-close">ไปหน้าจัดเมนู</a></div>');}
function showLogin(error=''){const target=$('#app');target.innerHTML=`<div class="narrow"><p class="eyebrow">งานร้านเจ๊เล่</p><h1>เข้าสู่งานของแม่</h1><p class="muted">ใช้บัญชีร้านที่ผูกกับระบบกลางเดิมค่ะ</p><form id="loginForm"><label class="field">อีเมล<input type="email" name="email" autocomplete="username" required></label><label class="field">รหัสผ่าน<input type="password" name="password" autocomplete="current-password" required></label><p class="form-error" id="loginError" role="alert">${esc(error)}</p><button class="primary wide" type="submit">เข้าสู่งานร้าน</button></form><button class="text-button wide" data-action="practice-mode">กลับไปพื้นที่ฝึก</button></div>`;$('#bottomArea').innerHTML='';}
function preserveInput(id,fn){const input=document.getElementById(id),selection=input?.selectionStart;fn();const next=document.getElementById(id);if(next){next.focus({preventScroll:true});if(next.type!=='search')next.setSelectionRange(selection,selection);}}
document.addEventListener('input',e=>{if(e.target.id==='menuSearch'){search=e.target.value;preserveInput('menuSearch',render);}else if(e.target.id==='ownerSearch'){ownerSearch=e.target.value;preserveInput('ownerSearch',render);}else if(e.target.id==='catalogSearch'){catalogSearch=e.target.value;$('#catalogRows').innerHTML=catalogRows();}});

async function saveShopBanner(file,input){
  if(!file||bannerSaving)return;
  if(mode!=='practice')return toast('ยังบันทึกป้ายร้านจริงจากหน้านี้ไม่ได้ค่ะ');
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){input.value='';return toast('เลือกภาพ JPG PNG หรือ WEBP ค่ะ');}
  if(busy){input.value='';return toast('รอบันทึกงานก่อน แล้วเลือกภาพอีกครั้งค่ะ');}
  bannerSaving=true;
  const preview=URL.createObjectURL(file);
  const previousKey=state.settings.bannerPhotoKey;
  const changeButton=document.querySelector('.shop-banner-change');
  if(changeButton){changeButton.disabled=true;changeButton.textContent='กำลังบันทึกภาพ…';}
  try{
    await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>image.naturalWidth&&image.naturalHeight?resolve():reject(Error('เปิดภาพนี้ไม่ได้ กรุณาเลือกไฟล์ภาพอีกครั้งค่ะ'));image.onerror=()=>reject(Error('เปิดภาพนี้ไม่ได้ กรุณาเลือกไฟล์ภาพอีกครั้งค่ะ'));image.src=preview;});
    const photoKey=await practice.savePhoto('__shop-banner__',file);
    const ok=await mutate('shop-banner',{photoKey});
    if(ok){
      if(previousKey&&previousKey!==photoKey&&photoUrls.has(previousKey)){URL.revokeObjectURL(photoUrls.get(previousKey));photoUrls.delete(previousKey);}
      toast('บันทึกโปสเตอร์ร้านในเครื่องนี้แล้วค่ะ');
    }
  }catch(error){toast(friendly(error));}
  finally{URL.revokeObjectURL(preview);input.value='';bannerSaving=false;if(changeButton?.isConnected){changeButton.disabled=false;changeButton.textContent='เปลี่ยนภาพ';}}
}

document.addEventListener('change',async e=>{if(e.target.id==='shopBannerUpload'){await saveShopBanner(e.target.files?.[0],e.target);return;}if(e.target.closest('#dishForm'))dishTotal();if(e.target.id==='dishPhoto'){const file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){e.target.value='';toast('เลือกภาพ JPG PNG หรือ WEBP ค่ะ');return;}draftPhoto=file;if(draftPreview)URL.revokeObjectURL(draftPreview);draftPreview=URL.createObjectURL(file);$('#photoPreview').innerHTML=`<img src="${draftPreview}" alt="ภาพที่แม่เลือก ยังไม่บันทึก">`;$('#editForm [name="removePhoto"]').value='0';}});
document.addEventListener('submit',async e=>{const form=e.target;if(!['dishForm','cartForm','editForm','payForm','cancelForm','loginForm'].includes(form.id))return;e.preventDefault();try{if(form.id==='dishForm'){const l=selectedDish();lineFor(state,l.dishId,l);const same=cart.find(x=>x.dishId===l.dishId&&x.note===l.note&&x.spice===l.spice&&JSON.stringify(x.selected)===JSON.stringify(l.selected));if(same){if(same.qty+l.qty>99)throw Error('จานนี้ในตะกร้าครบ 99 แล้ว');same.qty+=l.qty;}else cart.push(l);saveCart();closeSheet();render();toast('ใส่อาหารในตะกร้าแล้วค่ะ');}else if(form.id==='cartForm')confirmCart(new FormData(form).get('fulfillment'));else if(form.id==='editForm')await saveEdit(form,document.querySelector('[form="editForm"]'));else if(form.id==='payForm'){const ok=await mutate('pay',{id:form.dataset.id,finish:form.dataset.finish==='true',method:new FormData(form).get('method')||'cash'});if(ok){closeSheet();toast('บันทึกรับเงินเรียบร้อยค่ะ');}}else if(form.id==='cancelForm'){const ok=await mutate('cancel',{id:form.dataset.id,reason:new FormData(form).get('reason')});if(ok){closeSheet();toast('ยกเลิกรายการแล้วค่ะ');}}else if(form.id==='loginForm'){const btn=form.querySelector('button');btn.disabled=true;try{const fd=new FormData(form);await repo.login(String(fd.get('email')).trim(),String(fd.get('password')));form.reset();await reload();toast('เข้างานร้านเจ๊เล่แล้วค่ะ');}catch(error){$('#loginError').textContent=friendly(error);btn.disabled=false;}}}catch(error){const errorId=form.id==='dishForm'?'dishError':form.id==='cartForm'?'cartError':null;if(errorId&&document.getElementById(errorId))document.getElementById(errorId).textContent=friendly(error);else toast(friendly(error));}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;try{switch(a){case'close':closeSheet();break;case'cart':showCart();break;case'dish':showDish(id);break;case'category':category=b.dataset.value;foodView='all';render();break;case'food-view':foodView=b.dataset.value;category='all';render();break;case'owner-category':ownerCategory=b.dataset.value;render();break;case'orders':go('#/orders');break;case'track':go('#/track/'+encodeURIComponent(id));break;case'qty-minus':dishQty=Math.max(1,dishQty-1);dishTotal();break;case'qty-plus':dishQty=Math.min(99,dishQty+1);dishTotal();break;case'cart-minus':{const i=Number(b.dataset.index);if(cart[i]){cart[i].qty--;if(cart[i].qty<1)cart.splice(i,1);saveCart();render();showCart();}break;}case'cart-plus':{const i=Number(b.dataset.index);if(cart[i]){cart[i].qty=Math.min(99,cart[i].qty+1);saveCart();render();showCart();}break;}case'cart-remove':cart.splice(Number(b.dataset.index),1);saveCart();render();showCart();break;case'send':await sendOrder(b.dataset.fulfillment,b);break;case'open':if(await mutate('open'))toast('เปิดรับรายการแล้วค่ะ');break;case'pause':if(await mutate('pause'))toast('พักรับรายการใหม่แล้ว รายการเดิมยังอยู่ค่ะ');break;case'order-filter':filter=b.dataset.value;render();break;case'advance':b.disabled=true;if(await mutate('advance',{id}))toast('เปลี่ยนสถานะแล้วค่ะ');break;case'pay-sheet':showPayment(id);break;case'deliver':showPayment(id);break;case'prepay':showPayment(id,false);break;case'order-more':orderMore(id);break;case'cancel-sheet':cancelSheet(id);break;case'refund-sheet':refundSheet(id);break;case'refund-confirm':if(await mutate('refund',{id})){closeSheet();toast('บันทึกคืนเงินแล้วค่ะ');}break;case'edit':showEdit(id);break;case'new-dish':showEdit(null,{category:b.dataset.category||''});break;case'publish-sheet':publishSheet(id);break;case'publish-confirm':if(await mutate('publish',{id})){closeSheet();toast('เปิดขายเมนูนี้แล้วค่ะ');}break;case'unpublish-sheet':unpublishSheet(id);break;case'unpublish-confirm':if(await mutate('unpublish',{id})){closeSheet();toast('เก็บไว้ในรายชื่อรอเปิดขายแล้วค่ะ');}break;case'catalog':showCatalog();break;case'catalog-add':if(await mutate('dish',{id,patch:{active:true}})){showEdit(id);toast('เพิ่มไว้ให้แล้ว ตั้งราคาได้เลยค่ะ');}break;case'stock':stockSheet(b.dataset.key);break;case'stock-confirm':if(await mutate('stock',{key:b.dataset.key,available:b.dataset.available==='true'})){closeSheet();toast('เปลี่ยนของที่มีขายแล้วค่ะ');}break;case'sold-out':sheet('ของหมดในรายการนี้',`<div class="sheet-body"><p>ปิดของที่หมดในเมนูก่อน แล้วแจ้งลูกค้าเพื่อเลือกเปลี่ยนหรือยกเลิกรายการค่ะ รายการเดิมจะไม่หายเอง</p><a class="primary wide" href="#/mother/pending" data-action="navigate-close">ไปปิดของที่หมด</a><button class="text-button wide" data-action="cancel-sheet" data-id="${esc(id)}">ยกเลิกรายการนี้พร้อมเหตุผล</button></div>`);break;case'navigate-close':closeSheet();break;case'remove-photo':draftPhoto=null;if(draftPreview)URL.revokeObjectURL(draftPreview);draftPreview=null;$('#photoPreview').innerHTML=icon('image');$('#editForm [name="removePhoto"]').value='1';break;case'close-day':closeDaySheet();break;case'close-confirm':if(await mutate('close')){closeSheet();toast('เก็บยอดวันนี้แล้วค่ะ');}break;case'live-info':liveInfo();break;case'live-mode':if(!liveConfigured())return liveInfo();mode='live';try{localStorage.setItem('jele:mode',mode);}catch{}repo=new PlatformRepository();closeSheet();readCart();go('#/mother');await reload();break;case'practice-mode':mode='practice';try{localStorage.setItem('jele:mode',mode);}catch{}repo=practice;closeSheet();readCart();await reload();go('#/mother');break;case'logout':await repo.logout();showLogin();break;case'reset-practice':sheet('เริ่มข้อมูลฝึกใหม่',`<div class="sheet-body"><p>เอาราคา รูป และรายการฝึกในเครื่องนี้ออก แล้วเริ่มจากเมนูรอตั้งราคาอีกครั้ง ข้อมูลร้านจริงและร้านคุณยุ้ยไม่เปลี่ยนค่ะ</p></div>`,{footer:'<button class="secondary" data-action="close">เก็บไว้ก่อน</button><button class="danger" data-action="reset-confirm">เริ่มฝึกใหม่</button>'});break;case'reset-confirm':state=await practice.reset();cart=[];saveCart();closeSheet();go('#/mother/menu');render();toast('เริ่มข้อมูลฝึกใหม่แล้วค่ะ');break;}}catch(error){if(mode==='live'&&isMother())showLogin(friendly(error));else toast(friendly(error));}});
window.addEventListener('hashchange',async()=>{window.scrollTo({top:0,behavior:'instant'});if(mode==='live'){try{await reload();}catch(e){showLogin(friendly(e));}}else render();});
practice.subscribe(async()=>{if(mode!=='practice')return;await reload({renderPage:!$('#sheet').open});});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#sheet').open)reload().catch(e=>toast(friendly(e)));});
async function start(){readCart();try{repo=mode==='live'?new PlatformRepository():practice;await reload();if(mode==='live')setInterval(()=>{if(!$('#sheet').open&&document.visibilityState==='visible')reload().catch(()=>{});},15000);}catch(e){if(mode==='live'){showLogin(friendly(e));}else{$('#app').innerHTML=`<div class="error-view"><h1>ยังเปิดพื้นที่ฝึกไม่ได้</h1><p>${esc(friendly(e))}</p><button class="primary" data-action="retry-load">ลองเปิดใหม่</button></div>`;}}}
document.addEventListener('click',e=>{if(e.target.closest('[data-action="retry-load"]'))location.reload();});
initBannerViewer();
await start();

})().catch(function(error){var target=document.getElementById("app");if(target){var box=document.createElement("div");box.className="error-view";box.textContent="เปิดไฟล์นี้ไม่ได้ กรุณาเปิดไฟล์ด้วยเบราว์เซอร์ Chrome หรือ Firefox";target.replaceChildren(box);}});
