<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F8EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="คุณยุ้ย">
<title>คุณยุ้ย ส้มตำครกระเบิด</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Taviraj:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js"></script>
<style>
  :root {
    --cream: #F9F8EF; --card: #FFFEF9; --ink: #1D2A22; --muted: #6B7068;
    --line: #E6E0CF; --green: #06412A; --green-2: #0B5638; --green-soft: #E4EDE6;
    --gold: #B89A5A; --gold-soft: #F1EAD8; --red: #A63A2A; --red-soft: #F6E4DF;
    --bar-h: 64px; --w: 430px;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cream: #F9F8EF; } }
  :root[data-theme="dark"] { --cream: #F9F8EF; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; min-height: 100%; background: var(--cream); color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; line-height: 1.5;
    -webkit-tap-highlight-color: transparent; }
  .serif { font-family: "Taviraj", "Noto Serif Thai", serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-within {
    outline: 3px solid var(--gold); outline-offset: 2px; }
  .app { max-width: var(--w); margin: 0 auto; min-height: 100dvh; position: relative; }
  .pad { padding: 0 1rem; }
  .with-bar { padding-bottom: calc(var(--bar-h) + 1.5rem + env(safe-area-inset-bottom, 0px)); }

  .landing { height: 100dvh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .sign { position: relative; container-type: inline-size; aspect-ratio: 958 / 1642; width: min(100%, calc(100dvh * 958 / 1642)); }
  .sign img { display: block; width: 100%; height: 100%; }
  .sign .lock { position: absolute; left: 67%; top: 3.6%; transform: translate(-50%, -50%);
    width: max(40px, 10.5cqw); height: max(40px, 10.5cqw); display: grid; place-items: center;
    background: color-mix(in srgb, var(--cream) 85%, transparent); border: 1px solid var(--gold); border-radius: 50%; color: var(--green); }
  .sign .lock svg { width: 45%; height: 45%; }
  .sign .order { position: absolute; left: 50%; top: 87%; transform: translate(-50%, -50%);
    width: 44%; min-height: max(44px, 12.3cqw); display: flex; align-items: center; justify-content: center; gap: .5em;
    background: var(--green); color: var(--cream); border: 0; border-radius: 999px;
    font-family: "Taviraj", serif; font-weight: 600; font-size: clamp(15px, 4.6cqw, 24px);
    box-shadow: 0 0 0 2px var(--cream), 0 0 0 3px var(--gold), 0 4px 12px rgba(6,65,42,.25); }
  .sign .order svg { width: 1.15em; height: 1.15em; }

  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: .5rem;
    padding: .7rem 1rem; background: color-mix(in srgb, var(--cream) 92%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .brand { font-family: "Taviraj", serif; font-weight: 600; color: var(--green); font-size: 1.05rem; line-height: 1.2; }
  .brand small { display: block; font-family: "IBM Plex Sans Thai", sans-serif; font-weight: 400; color: var(--muted); font-size: .72rem; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--green); position: relative; }
  .icon-btn svg { width: 20px; height: 20px; }
  .dot { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: .7rem; display: grid; place-items: center; }
  .back { border: 0; background: none; color: var(--green); display: inline-flex; align-items: center; gap: .25rem; padding: .3rem 0; }
  .back svg { width: 20px; height: 20px; }
  .qbadge { font-family: "Taviraj", serif; font-weight: 600; color: var(--green); background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 999px; padding: .15rem .7rem; font-size: .95rem; white-space: nowrap; }

  .hero { margin: 1rem; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; position: relative; border: 1px solid var(--gold); background: var(--gold-soft); display: grid; place-items: center; }
  .hero img { width: 100%; height: 100%; object-fit: cover; }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; padding: .95rem 1rem .1rem; }
  .catcard { display: flex; align-items: center; gap: .65rem; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: .5rem .65rem .5rem .5rem; min-height: 62px; }
  .catcard.on { border-color: #0E6B3D; background: #E1EFE5; }
  .catcard:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .catcard .ct { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; }
  .catcard .ct svg { width: 28px; height: 28px; color: #F9F8EF; }
  .ct.red { background: linear-gradient(145deg, #A3342B, #7A211B); }
  .ct.green { background: linear-gradient(145deg, #0F7343, #06412A); }
  .catcard b { display: block; font-size: .95rem; line-height: 1.2; }
  .catcard small { color: var(--muted); font-size: .75rem; }
  .hero-text { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: .1rem; text-align: center; padding: 0 24%; color: #F9F8EF; pointer-events: none; text-shadow: 0 2px 16px rgba(0,0,0,.45); }
  .hero-text b { font-family: "Taviraj", serif; font-weight: 600; font-size: clamp(1.7rem, 8vw, 2.3rem); line-height: 1.1; }
  .hero-text span { font-family: "Taviraj", serif; font-weight: 600; font-size: clamp(1rem, 4.6vw, 1.3rem); }
  .hero-text em { font-style: normal; font-size: clamp(.72rem, 3.2vw, .9rem); color: #F0D9A0; margin-top: .3rem; }
  .crop-opt { color: #F9F8EF; display: flex; align-items: center; gap: .5rem; font-size: .9rem; }
  .crop-opt input { accent-color: var(--gold); width: 18px; height: 18px; }
  .hero.wide { margin: 0; border-radius: 0 0 24px 24px; border-width: 0 0 1px; aspect-ratio: 3 / 2; }
  .pill-t { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; text-align: left; }
  .pill-t small { font-size: .72rem; font-weight: 600; color: var(--gold); letter-spacing: .02em; }
  .hero .ph { text-align: center; color: var(--green); display: grid; gap: .3rem; justify-items: center; }
  .hero .ph b { display: block; font-family: "Taviraj", serif; font-size: 1.6rem; }
  .hero .ph span { font-size: .8rem; color: var(--muted); }
  .create { position: absolute; right: .6rem; bottom: .6rem; display: inline-flex; align-items: center; gap: .3rem; background: var(--green); color: var(--cream); border-radius: 999px; padding: .4rem .8rem; font-size: .85rem; cursor: pointer; }
  .create.center { position: static; }
  .sr-file { position: absolute; width: 1px; height: 1px; opacity: 0; }

  /* หน้าเมนูลูกค้าแบบสะอาด: หัวกลาง + แท็บหมวด */
  .langbtn { min-height: 36px; min-width: 44px; padding: .15rem .7rem; border: 1px solid var(--gold); border-radius: 999px; background: var(--cream); color: var(--green);
    font: 700 .85rem "IBM Plex Sans Thai", sans-serif; cursor: pointer; white-space: nowrap; }
  .tr { display: flex; align-items: center; gap: .45rem; }
  .langfloat { display: flex; justify-content: flex-end; padding: .6rem 1rem 0; }
  .sign .langbtn { position: absolute; left: 6%; top: 3.6%; transform: translateY(-50%); }
  .mtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: .5rem;
    padding: .65rem 1rem; background: color-mix(in srgb, var(--cream) 94%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .mtop .mt { text-align: center; line-height: 1.2; min-width: 0; }
  .mtop .mt b { display: block; font-size: .98rem; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mtop .mt small { color: var(--muted); font-size: .72rem; }
  .mhead { display: flex; align-items: flex-end; justify-content: space-between; gap: .5rem; padding: 1rem 1rem .6rem; }
  .mhead h2 { margin: 0; font-family: "Taviraj", serif; font-size: 1.6rem; color: var(--green); line-height: 1.15; }
  .mhead p { margin: .15rem 0 0; font-size: .85rem; color: var(--muted); }
  .mtabs { display: flex; gap: .4rem; margin: 0 1rem .8rem; padding: .3rem; background: var(--gold-soft); border-radius: 16px; overflow-x: auto; scrollbar-width: none; }
  .mtabs::-webkit-scrollbar { display: none; }
  .mtab { flex: 1 0 auto; border: 0; background: none; border-radius: 12px; padding: .65rem 1rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .mtab.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .pill.ord { flex: .8; gap: .35rem; }
  .pill-e { font-size: 1.35rem; line-height: 1; }
  .section-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .5rem 1rem .6rem; }
  .section-head h2 { margin: 0; font-family: "Taviraj", serif; font-size: 1.25rem; color: var(--green); }
  .search { display: flex; align-items: center; gap: .4rem; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: .35rem .8rem; color: var(--muted); font-size: .9rem; }
  .search svg { width: 16px; height: 16px; }
  .search-input { margin: 0 1rem .6rem; width: calc(100% - 2rem); border: 1px solid var(--gold); background: var(--card); border-radius: 999px; padding: .55rem 1rem; }
  .chips { display: flex; gap: .5rem; overflow-x: auto; padding: 0 1rem .8rem; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--gold); background: var(--card); color: var(--green); border-radius: 999px; padding: .4rem .9rem; font-size: .92rem; }
  .chip.on { background: var(--green); color: var(--cream); border-color: var(--green); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; padding: 0 1rem; }
  .dish { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; }
  .dish-open { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; flex: 1; width: 100%; }
  .dish .foot { display: flex; align-items: center; justify-content: space-between; padding: 0 .7rem .7rem; }
  button.plus { border: 0; width: 38px; height: 38px; font-size: 1.3rem; }
  .cart-opt { margin-top: .3rem; border: 1px solid var(--gold); border-radius: 999px; padding: .2rem .6rem; background: var(--card); font-size: .85rem; color: var(--green); }
  .msg { background: var(--card); border: 1px solid var(--gold); border-left: 4px solid var(--red); border-radius: 12px; padding: .75rem .9rem; margin: .6rem 1rem; }
  .msg.read { border-left-color: var(--gold); }
  .msg .t { font-weight: 600; color: var(--ink); }
  .msg .sug { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
  .day-head { margin: 1.1rem 1rem .2rem; font-family: "Taviraj", serif; color: var(--green); font-weight: 600; }
  .reorder-note { margin: .5rem 0; padding: .45rem .7rem; border-radius: 8px; background: var(--gold-soft); color: var(--green); font-size: .85rem; }
  .preset { display: flex; flex-wrap: wrap; gap: .4rem; margin: -.3rem 0 .8rem; }
  .dish .pic { aspect-ratio: 4 / 3; background: var(--gold-soft); display: grid; place-items: center; position: relative; }
  .dish .pic img { width: 100%; height: 100%; object-fit: cover; }
  .leaf { width: 38px; height: 38px; color: var(--gold); }
  .dish .body { padding: .55rem .7rem .7rem; display: flex; flex-direction: column; gap: .15rem; flex: 1; }
  .dish .name { font-weight: 600; font-size: .95rem; }
  .dish .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
  .price { font-family: "Taviraj", serif; font-weight: 600; color: var(--green); }
  .plus { width: 30px; height: 30px; border-radius: 50%; background: var(--green); color: var(--cream); display: grid; place-items: center; font-size: 1.1rem; line-height: 1; }
  .soldout { position: absolute; inset: 0; background: rgba(249,248,239,.75); display: grid; place-items: center; font-weight: 600; color: var(--red); }
  .tag { font-size: .72rem; color: var(--gold); }
  .empty { margin: 1rem; padding: 1rem; border: 1px dashed var(--gold); border-radius: 12px; color: var(--muted); text-align: center; }
  .banner { margin: .75rem 1rem 0; padding: .6rem .9rem; border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: .9rem; }

  .bottombar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(100%, var(--w)); z-index: 30; background: var(--card); border-top: 1px solid var(--line);
    padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom, 0px)); display: flex; gap: .6rem; }
  .pill { flex: 1; min-height: 48px; border-radius: 999px; border: 1px solid var(--gold); background: var(--card); color: var(--green); display: flex; align-items: center; justify-content: center; gap: .45rem; font-weight: 600; }
  .pill svg { width: 20px; height: 20px; }
  .pill.main { flex: 1.6; background: var(--green); color: var(--cream); border-color: var(--green); }
  .pill:disabled { opacity: .5; cursor: default; }
  .pill .count { background: var(--gold); color: #fff; border-radius: 999px; font-size: .75rem; padding: 0 .45rem; }
  .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: min(100%, var(--w)); z-index: 30; background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tab { border: 0; background: none; padding: .55rem .2rem .6rem; display: flex; flex-direction: column; align-items: center; gap: .15rem; color: var(--muted); font-size: .72rem; min-height: var(--bar-h); }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--green); font-weight: 600; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .9rem; margin: .75rem 1rem; }
  .card h3 { margin: 0 0 .5rem; font-size: 1rem; }
  .btn { min-height: 48px; border-radius: 999px; border: 1px solid var(--green); background: var(--green); color: var(--cream); font-weight: 600; padding: 0 1.2rem;
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem; }
  .btn.block { width: 100%; }
  .btn.ghost { background: var(--card); color: var(--green); border-color: var(--gold); }
  .btn.danger { background: var(--card); color: var(--red); border-color: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.sm { min-height: 38px; font-size: .88rem; padding: 0 .9rem; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
  .seg label { border: 1px solid var(--gold); border-radius: 12px; padding: .7rem; text-align: center; cursor: pointer; background: var(--card); }
  .seg input { position: absolute; opacity: 0; }
  .seg label:has(input:checked) { background: var(--green); color: var(--cream); border-color: var(--green); }
  .field { display: block; margin-bottom: .8rem; }
  .field span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .25rem; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: .65rem .8rem; }
  .line { display: flex; justify-content: space-between; gap: .75rem; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  .line:last-child { border-bottom: 0; }
  .muted { color: var(--muted); font-size: .85rem; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: .5rem; }
  .total b { font-family: "Taviraj", serif; font-size: 1.4rem; color: var(--green); }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--gold); border-radius: 999px; }
  .stepper button { width: 34px; height: 34px; border: 0; background: none; color: var(--green); font-size: 1.1rem; }
  .stepper span { min-width: 1.6rem; text-align: center; font-weight: 600; }
  .opt { display: flex; align-items: center; justify-content: space-between; padding: .55rem .2rem; border-bottom: 1px solid var(--line); cursor: pointer; }
  .opt:last-child { border-bottom: 0; }
  .opt input { accent-color: var(--green); width: 18px; height: 18px; }
  .req { font-size: .72rem; color: var(--red); margin-left: .35rem; }

  .bigq { text-align: center; padding: 1.4rem 1rem .6rem; }
  .bigq .lbl { color: var(--muted); font-size: .9rem; }
  .bigq .code { font-family: "Taviraj", serif; font-size: 4rem; font-weight: 600; color: var(--green); line-height: 1.1; letter-spacing: .03em; }
  .qr { display: grid; justify-items: center; gap: .5rem; text-align: center; }
  .qr .box { width: 220px; height: 220px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .qr .box svg { width: 100%; height: 100%; }
  .pp-logo { font-weight: 600; color: #113566; letter-spacing: .02em; }

  .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: .25rem; margin: .6rem 0 .2rem; }
  .steps div { text-align: center; font-size: .75rem; color: var(--muted); }
  .steps i { display: block; height: 6px; border-radius: 3px; background: var(--line); margin-bottom: .3rem; }
  .steps .done i { background: var(--green); }
  .steps .done { color: var(--green); font-weight: 600; }
  .status { display: inline-block; font-size: .78rem; padding: .1rem .6rem; border-radius: 999px; background: var(--gold-soft); color: var(--green); }
  .status.new { background: var(--red-soft); color: var(--red); }
  .status.cancelled { background: #EEE; color: var(--muted); }
  .status.completed { background: var(--green-soft); }
  .oc-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .oc-q { font-family: "Taviraj", serif; font-size: 1.7rem; font-weight: 600; color: var(--green); line-height: 1; }
  .oc-items { margin: .5rem 0; font-size: .92rem; }
  .oc-meta { display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .5rem; }
  .meta-chip { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: .05rem .55rem; color: var(--muted); }
  .meta-chip.warn { border-color: var(--red); color: var(--red); }
  .actions { display: flex; flex-wrap: wrap; gap: .45rem; }

  /* ---- v2 flow: cart / review / done / tracking (same green-cream palette) ---- */
  .page-title { text-align: center; padding: .9rem 1rem .2rem; }
  .page-title h2 { margin: 0; font-family: "Taviraj", serif; color: var(--green); font-size: 1.35rem; }
  .page-title span { font-size: .8rem; color: var(--muted); }
  .cl { display: grid; grid-template-columns: 76px 1fr auto; gap: .8rem; align-items: start; }
  .cl-pic { width: 76px; height: 76px; border-radius: 12px; overflow: hidden; background: var(--gold-soft); display: grid; place-items: center; color: var(--gold); }
  .cl-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cl-pic svg { width: 40px; height: 40px; }
  .cl b { display: block; line-height: 1.3; }
  .cl-price { font-family: "Taviraj", serif; font-weight: 600; color: var(--green); font-size: 1.05rem; white-space: nowrap; }
  .cl-del { border: 0; background: none; color: var(--red); font-weight: 600; font-size: .88rem; padding: .35rem 0; min-height: 36px; }
  .cl-row { display: flex; align-items: center; gap: .9rem; margin-top: .45rem; flex-wrap: wrap; }
  .dark-box { background: var(--green); color: var(--cream); border-radius: 16px; padding: 1rem 1.1rem; margin: .75rem 1rem; }
  .dark-box .r { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; opacity: .85; padding-bottom: .55rem; margin-bottom: .55rem; border-bottom: 1px solid rgba(249,248,239,.25); }
  .dark-box .t { display: flex; justify-content: space-between; align-items: baseline; }
  .dark-box .t span { font-weight: 600; }
  .dark-box .t b { font-family: "Taviraj", serif; font-size: 1.7rem; }
  .btns { display: grid; gap: .6rem; margin: .75rem 1rem 0; }

  .arch-year { display: flex; gap: .5rem; overflow-x: auto; padding: .8rem 1rem .2rem; }
  .month { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: .75rem 1rem; overflow: hidden; }
  .month summary { list-style: none; cursor: pointer; padding: .8rem .9rem; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }

  .day-row .d small { display: block; font-family: "IBM Plex Sans Thai", sans-serif; font-size: .68rem; color: var(--muted); font-weight: 400; }
  .day-row .price { white-space: nowrap; }
  .chip-s { font-size: .72rem; border-radius: 999px; padding: .05rem .5rem; background: var(--green-soft); color: var(--green); }

  .kv.sum { border-top: 2px solid var(--gold); border-bottom: 0; margin-top: .2rem; padding-top: .6rem; }

  .oline span:nth-child(n+2) { text-align: right; }
  .orow .oitems { grid-column: 1 / -1; font-size: .78rem; color: var(--muted); line-height: 1.35; }
  .login-head { text-align: center; padding: 2.5rem 1rem 1rem; }
  .login-head .serif { font-size: 1.8rem; color: var(--green); font-weight: 600; line-height: 1.2; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--gold-soft); border-top-color: var(--green); animation: spin 1s linear infinite; margin: 1rem auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .scrim { position: fixed; inset: 0; background: rgba(29,42,34,.45); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: min(100%, var(--w)); max-height: 88dvh; overflow: auto; background: var(--cream); border-radius: 18px 18px 0 0; padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px)); }
  .sheet h3 { margin: 0 0 .8rem; font-family: "Taviraj", serif; color: var(--green); font-size: 1.25rem; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bar-h) + 1.2rem + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--cream);
    padding: .55rem 1rem; border-radius: 999px; font-size: .9rem; z-index: 70; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .crop-layer { position: fixed; inset: 0; z-index: 80; background: rgba(15,22,18,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; }
  .crop-layer h3 { color: #F9F8EF; margin: 0; font-family: "Taviraj", serif; font-weight: 600; }
  .crop-frame { position: relative; width: min(92%, 400px); overflow: hidden; border-radius: 14px; background: #000; touch-action: none; box-shadow: 0 0 0 2px var(--gold); cursor: grab; }
  .crop-frame img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .crop-frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to right, transparent 33.1%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.7%, transparent 66.9%),
                linear-gradient(to bottom, transparent 33.1%, rgba(255,255,255,.35) 33.3%, transparent 33.5%, transparent 66.5%, rgba(255,255,255,.35) 66.7%, transparent 66.9%); }
  .crop-zoom { width: min(92%, 400px); accent-color: var(--gold); }
  .crop-hint { color: #CFCBBE; font-size: .85rem; margin: 0; text-align: center; }
  .crop-actions { display: flex; gap: .6rem; width: min(92%, 400px); }
  .busy { position: fixed; inset: 0; z-index: 90; background: rgba(15,22,18,.55); display: grid; place-items: center; color: #fff; }
  .prog { margin: .75rem 1rem; padding: .8rem .9rem; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: .4rem 0; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 4px; transition: width .2s; }
  .slots { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: .5rem 1rem; overflow: hidden; }
  .slot { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: .7rem; align-items: center; padding: .5rem .8rem; border-top: 1px solid var(--line); }

  .slot-info { border: 0; background: none; text-align: left; padding: 0; min-width: 0; }
  .slot-info .n { display: block; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-info .s { font-size: .78rem; color: var(--muted); }
  .badge { display: inline-block; font-size: .68rem; border-radius: 999px; padding: 0 .4rem; margin-left: .3rem; background: var(--red-soft); color: var(--red); }
  .badge.star { background: var(--gold-soft); color: var(--green); }
  .more { display: block; width: calc(100% - 2rem); margin: .8rem 1rem; }
  .import-card { width: min(90vw, 380px); background: var(--cream); border-radius: 16px; padding: 1.1rem; color: var(--ink); }
  .list-mini { font-size: .8rem; color: var(--muted); margin: .2rem 0 .6rem; word-break: break-all; }
  .scrim, .crop-layer, .busy { inset: 0 auto 0 50%; width: min(100%, var(--w)); transform: translateX(-50%); }

  /* ===== wide screens (laptop / desktop, 900px and up). The phone layout above is not changed. ===== */
  html[data-view="yui"] { --w: 680px; }
  @media (min-width: 900px) {
    html[data-view="owner"] { --w: 1240px; }
    html[data-view="exec"]  { --w: 1100px; }
    html[data-view="yui"]   { --w: 1180px; }
    html[data-view="cust"]  { --w: 780px; }
    /* pop-ups become centred dialogs instead of bottom sheets */
    .scrim, .crop-layer, .busy { inset: 0; width: auto; transform: none; }
    .scrim { align-items: center; }
    .sheet { width: min(92vw, 560px); border-radius: 18px; max-height: 90dvh; }
    html[data-view] .toast { max-width: 520px; }
    /* customer: more dishes per row */
    html[data-view="cust"] .grid { grid-template-columns: repeat(3, 1fr); }
    /* back office: tabs become a left side bar, content uses the width */
    html[data-view="owner"] .app:has(> .tabbar) { padding-left: 200px; }
    .login-head ~ .card, .login-head ~ .banner { max-width: 440px; margin-left: auto; margin-right: auto; }
    html[data-view="owner"] .tabbar { left: max(0px, calc((100% - var(--w)) / 2)); transform: none; top: 0; bottom: 0; width: 200px;
      display: flex; flex-direction: column; justify-content: flex-start; gap: .25rem; padding: 1.2rem .8rem; border-top: 0; border-right: 1px solid var(--line); }
    html[data-view="owner"] .tab { flex-direction: row; justify-content: flex-start; gap: .7rem; min-height: 0; padding: .75rem 1rem; font-size: .95rem; border-radius: 12px; }
    html[data-view="owner"] .tab:hover { background: var(--cream); }
    html[data-view="owner"] .tab.on { background: var(--green-soft); }
    html[data-view="owner"] .with-bar { padding-bottom: 2rem; }
    html[data-view="owner"] .toast { bottom: 1.5rem; }
    html[data-view="owner"] .with-bar:not(.ow-orders):not(.ow-dash):not(.ow-menu) { max-width: 780px; margin-left: auto; margin-right: auto; }
    .ow-orders { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); align-items: start; }
    .ow-orders > * { grid-column: 1 / -1; }
    .ow-orders > .ord-card { grid-column: auto; }
    .ow-dash { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
    .ow-dash > * { grid-column: 1 / -1; }
    .ow-dash > .card { grid-column: auto; }
    .ow-menu .hero { max-width: 420px; margin-left: auto; margin-right: auto; }
    .ow-menu .slots { display: grid; grid-template-columns: 1fr 1fr; }
    .ow-menu .slot:nth-child(2) { border-top: 0; }
    .ow-menu .slot:nth-child(even) { border-left: 1px solid var(--line); }
    /* executive: cards side by side */
    .x-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
    .x-wrap > * { grid-column: 1 / -1; }
    .x-wrap > .xcard { grid-column: auto; }
    /* Khun Yui's screen: figures on the left, live order list on the right */
    html[data-view="yui"] .yui { max-width: none; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); column-gap: .5rem; align-items: start; }
    .yui > * { grid-column: 1 / -1; }
    .yui > .yt2, .yui > .fold { grid-column: 1; }
    .yui > .ytable { grid-column: 2; grid-row: span 2; }
  }
  @media (min-width: 520px) {
    html { background: #C9C4B2; }
    body { background: transparent; }
    .app { background: var(--cream); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 0 60px rgba(0,0,0,.18); }
    .toast { max-width: calc(var(--w) - 2rem); }
  }
  .xcard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin: .75rem 1rem; padding: .9rem; }
  .xhead { display: flex; justify-content: space-between; align-items: flex-start; gap: .5rem; }
  .xhead h2 { margin: 0; font-family: "Taviraj", serif; color: var(--green); font-size: 1.15rem; line-height: 1.25; }
  .pillstat { font-size: .72rem; border-radius: 999px; padding: .1rem .6rem; white-space: nowrap; }
  .pillstat.ok { background: #E1EFE5; color: #0E6B3D; }

function qrPng(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), sc = 16, pad = 4 * sc, cap = 150;
  const cv = document.createElement('canvas'); cv.width = n * sc + pad * 2; cv.height = n * sc + pad * 2 + cap;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#111';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect(pad + x * sc, pad + y * sc, sc, sc);
  g.textAlign = 'center'; g.fillStyle = '#06412A';
  g.font = '600 46px Taviraj, "Noto Serif Thai", serif'; g.fillText('สแกนเพื่อสั่งอาหาร', cv.width / 2, n * sc + pad * 2 + 40);
  g.font = '32px "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif'; g.fillText('คุณยุ้ย ส้มตำครกระเบิด', cv.width / 2, n * sc + pad * 2 + 95);
  return cv.toDataURL('image/png');
}

async function loadMenuQ(owner, c0, en) {

    .eq('store_id', CONFIG.store).order('sort_order').order('sku');

    c0.from('menu_categories').select('id, code, name, sort_order' + nE).eq('store_id', CONFIG.store).eq('is_active', true).order('sort_order'),
    items,
    c0.from('menu_item_option_groups').select('menu_item_id, sort_order, menu_option_groups(id, code, name' + nE + ', selection_type, min_select, max_select, is_active, sort_order, menu_option_values(id, code, name' + nE + ', price_delta_satang, is_available, is_default, sort_order))')
  ]);
  const e = c.error || i.error || l.error; if (e) throw e;
  S.cats = c.data; S.items = i.data.filter(x => owner || !x.is_archived); S.links = l.data;
  const E = { cat: {}, item: {}, grp: {}, val: {}, desc: {} };

  S.items.forEach(x => { if (x.name_en) E.item[x.id] = x.name_en; if (x.description_en) E.desc[x.id] = x.description_en; });
  S.links.forEach(k => { const g = k.menu_option_groups; if (!g) return; if (g.name_en) E.grp[g.id] = g.name_en; (g.menu_option_values || []).forEach(v => { if (v.name_en) E.val[v.id] = v.name_en; }); });
  S.en = E;
  const M = {}; // Thai name -> English name (used by the translator for any place a menu name appears)
  S.cats.forEach(x => { if (x.name_en) M[x.name] = x.name_en; });
  S.links.forEach(k => { const g = k.menu_option_groups; if (!g) return; if (g.name_en) M[g.name] = g.name_en; (g.menu_option_values || []).forEach(v => { if (v.name_en) M[v.name] = v.name_en; }); });
  S.items.forEach(x => { if (x.name_en) M[x.name] = x.name_en; });

}
async function signImages(c0 = sb) {
  const all = [...new Set(S.items.map(x => x.image_path).concat(S.settings?.hero_image_path || []).filter(Boolean))].filter(p => !S.urls[p]);
  all.filter(p => !p.startsWith('stores/')).forEach(p => { S.urls[p] = /^https?:/.test(p) ? p : p.replace(/^\/+/, ''); });
  const paths = all.filter(p => p.startsWith('stores/'));
  if (paths.length) {
    const { data } = await c0.storage.from('menu-images').createSignedUrls(paths, 60 * 60 * 6);
    (data || []).forEach(d => { if (d.signedUrl) S.urls[d.path] = d.signedUrl; });
  }
  S.heroUrl = S.settings?.hero_image_path ? S.urls[S.settings.hero_image_path] || null : null;
}
const groupsOf = (id) => S.links.filter(l => l.menu_item_id === id && l.menu_option_groups && l.menu_option_groups.is_active)
  .sort((a, b) => a.sort_order - b.sort_order)
  .map(l => ({ ...l.menu_option_groups, values: (l.menu_option_groups.menu_option_values || []).sort((a, b) => a.sort_order - b.sort_order)
    .filter(v => v.code !== 'SALTED_EGG' && !(MIX_NAMES.includes(v.name) && ((S.items.find(x => x.id === id) || {}).name || '').includes(v.name))) })); // ร้านไม่มีไข่เค็ม
// กลุ่มบังคับที่ไม่มีค่าเริ่มต้น (เช่น ชนิดกุ้ง) จะไม่ถูกเลือกให้ ลูกค้าต้องเลือกเอง -> complete = false
function defaultPicks(id) {
  const picks = []; let complete = true;
  for (const g of groupsOf(id)) {
    if (g.selection_type !== 'single' || g.min_select < 1) continue;
    const v = g.values.find(x => x.is_default && x.is_available);
    if (v) picks.push(v.id); else complete = false;
  }
  return { picks, complete };
}
function makeLine(id, qty, picks, note) {
  const it = S.items.find(x => x.id === id), vals = [], codes = [];
  groupsOf(id).forEach(g => g.values.forEach(v => { if (picks.includes(v.id)) { vals.push(v); codes.push(g.code || null); } }));
  return { id, name: it.name, qty, opts: vals.map(v => v.id), optNames: vals.map(v => v.name), optCodes: codes, note: note || '', unit: it.price_satang + vals.reduce((s, v) => s + v.price_delta_satang, 0) };
}
function addLine(line) {
  const same = S.cart.find(l => l.id === line.id && !l.note && !line.note && l.opts.join() === line.opts.join());
  if (same) same.qty = Math.min(20, same.qty + line.qty); else S.cart.push(line);
  saveCart();
}
const cartCount = () => S.cart.reduce((s, l) => s + l.qty, 0);
const cartTotal = () => S.cart.reduce((s, l) => s + l.unit * l.qty, 0);

async function loadMyOrders() {
  const { data: { user } } = await sb.auth.getUser();
  const [o, m] = await Promise.all([
    sb.from('orders').select('id, business_date, queue_code, status, total_satang, fulfillment_type, created_at, customer_user_id, cancel_source, cancel_reason, replaces_order_id, order_items(menu_item_id, menu_name_snapshot, quantity, customer_note, order_item_options(option_value_id, option_name_snapshot, menu_option_values(menu_option_groups(code)))), payments(method, status)')
      .eq('store_id', CONFIG.store).eq('customer_user_id', user?.id).order('created_at', { ascending: false }).limit(100),
    sb.from('customer_messages').select('id, order_id, queue_code, kind, title, body, suggestions, created_at, read_at')
      .eq('store_id', CONFIG.store).eq('customer_user_id', user?.id).order('created_at', { ascending: false }).limit(30)
  ]);
  if (o.error) throw o.error;
  S.myOrders = o.data; S.messages = m.data || [];
  S.myOrders.filter(x => !['completed', 'cancelled'].includes(x.status) || S.messages.some(mm => mm.order_id === x.id))
    .forEach(x => listen('order:' + x.id, async (ev, p) => {
      const t = S.myOrders.find(y => y.id === x.id); if (!t) return;
      if (ev === 'order_changed') { t.status = p.status; if (p.status === 'cancelled') { await loadMyOrders(); } }
      if (ev === 'payment_changed' && t.payments[0]) t.payments[0].status = p.status;
      if (ev === 'message') { await loadMyOrders(); toast(p.title); }
      if (['orders', 'done', 'menu'].includes(route()[0])) render();
    }));
}
const unread = () => S.messages.filter(m => !m.read_at).length;
const replacedIds = () => new Set(S.myOrders.map(o => o.replaces_order_id).filter(Boolean));
// Same-number re-order: only for shop-cancelled orders not yet replaced; the server also enforces "same business day".
const canReorder = (o) => o && o.status === 'cancelled' && o.cancel_source === 'owner' && !replacedIds().has(o.id)
  && (Date.now() - new Date(o.created_at)) < 20 * 3600e3;

// ---------------- router ----------------
const route = () => (location.hash.replace(/^#\/?/, '').split('?')[0] || '').split('/').filter(Boolean);
const go = (h) => { if (location.hash === h) show(); else location.hash = h; };
window.addEventListener('hashchange', () => show());

async function show() {
  const r = route(); closeModal();
  // the layout width is chosen in CSS from this marker (phone column by default; wider panels on laptops)
  document.documentElement.dataset.view = ({ owner: 'owner', exec: 'exec', yui: 'yui' })[r[0]] || (r[0] ? 'cust' : 'home');
  if (r[0] !== 'yui') leaveYui();
  try {
    if (r[0] === 'owner') return await showOwner(r[1] || 'orders', r[2]);
    if (r[0] === 'exec') return await showExec();
    if (r[0] === 'yui') return await showYui();
    if (!r[0]) { render(); return; }
    await ensureCustomer();
    if (!S.settings) await loadSettings();
    if (!S.cats.length) await loadMenu(false);
    if (r[0] === 'menu' || r[0] === 'cart' || r[0] === 'review') {
      if (S.reorder) { S.queue = { queue_code: S.reorder.queue_code }; S.queueErr = null; S.closedStore = false; }
      else if (r[0] === 'menu' || !S.queue) {
        try { const d = await rpc('reserve_queue', { p_store_id: CONFIG.store }); S.queue = d[0]; S.queueErr = null; S.closedStore = false; }
        catch (e) { S.queue = null; S.queueErr = nice(e); S.closedStore = /store_not_accepting_orders/.test((e && e.message) || ''); }
      }
      listen(`store:${CONFIG.store}:menu`, async () => { await loadMenu(false); if (route()[0] !== 'owner') render(); });
      listen(`store:${CONFIG.store}:status`, async () => { await loadSettings(); await signImages(); if (route()[0] !== 'owner') show(); });
      await loadMyOrders();
    }
    if (r[0] === 'item') {
      const d = S.items.find(x => x.id === r[1]); if (!d) return go('#/menu');
      if (!S.draft || S.draft.id !== d.id) S.draft = { id: d.id, qty: 1, note: '', picked: defaultPicks(d.id).picks };
    }
    if (r[0] === 'done' || r[0] === 'orders') await loadMyOrders();
    if (r[0] === 'orders' && unread()) rpc('mark_messages_read', { p_store_id: CONFIG.store }).catch(() => {});
    render(); window.scrollTo(0, 0);
  } catch (e) { render(); toast(nice(e)); }
}

V.item = () => {

  const valCodes = gs.flatMap(g => g.values.map(v => ({ v, c: g.code }))).filter(x => dr.picked.includes(x.v.id)).map(x => x.c);
  const ok = gs.every(g => { const n = g.values.filter(v => dr.picked.includes(v.id)).length; return n >= g.min_select && n <= g.max_select; });
  return `
  <div class="topbar"><button class="back" data-go="#/menu">${I.back} ${t('เมนู')}</button><span class="tr">${S.queue ? `<span class="qbadge">${t('คิว {0}', esc(S.queue.queue_code))}</span>` : ''}${langBtn()}</span></div>

      ${g.values.map(v => `<label class="opt"><span>${esc(enName('val', v.id, v.name))}${v.price_delta_satang ? ` <span class="muted">+${baht(v.price_delta_satang)}</span>` : ''}${!v.is_available ? ` <span class="muted">${t('(หมด)')}</span>` : ''}</span>
        <input type="${g.selection_type === 'single' ? 'radio' : 'checkbox'}" name="g-${g.id}" value="${v.id}" data-opt="${g.id}" ${dr.picked.includes(v.id) ? 'checked' : ''} ${!v.is_available ? 'disabled' : ''}></label>`).join('')}</div>`).join('')}
    ${vals.some(v => MIX_NAMES.includes(v.name)) ? `<div class="card" style="background:var(--gold-soft)"><div class="muted" style="font-size:.78rem">${t('ชื่อเมนูของคุณ')}</div><b style="font-size:1.05rem">${esc(dispName(d.name, vals.map(v => v.name), valCodes, { item: d.id, vals: vals.map(v => v.id) }))}</b></div>` : ''}

V.cart = () => `
  <div class="topbar"><button class="back" data-go="#/menu">${I.back} ${t('เมนู')}</button><span class="tr">${S.queue ? `<span class="qbadge">${t('คิว {0}', esc(S.queue.queue_code))}</span>` : ''}${langBtn()}</span></div>
  <div class="with-bar">
    <div class="page-title"><h2>${t('ตะกร้า')}</h2><span>${t('{0} รายการ', S.cart.length)}</span></div>

            <button class="cl-del" data-act="cdel" data-i="${i}">${t('ลบรายการ')}</button></div></div>
        <div class="cl-price">${baht(l.unit * l.qty)}</div></div></div>`; }).join('')
    + `<div class="dark-box"><div class="r"><span>${t('จำนวนอาหาร')}</span><span>${t('{0} รายการ', S.cart.length)}</span></div><div class="t"><span>${t('ยอดรวม')}</span><b>${baht(cartTotal())}</b></div></div>
      <div class="btns"><button class="btn" data-go="#/review">${t('ตรวจสอบคำสั่งซื้อ')}</button><button class="btn ghost" data-go="#/menu">${t('เลือกเมนูเพิ่ม')}</button></div>`
    : `<div class="empty">${t('ตะกร้ายังว่าง')}</div><div class="btns"><button class="btn" data-go="#/menu">${t('เลือกเมนู')}</button></div>`}
  </div>`;

  const o = S.myOrders.find(x => x.id === route()[1]);
  if (!o) return `<div class="empty">${t('ไม่พบออเดอร์')}</div><div class="pad"><button class="btn block" data-go="#/menu">${t('กลับเมนู')}</button></div>`;
  const pay = o.payments[0] || {};
  return `
  <div class="with-bar">
    <div class="done-wrap"><div class="done-ic" aria-hidden="true">✓</div><h2>${t('สั่งอาหารสำเร็จ')}</h2><p class="muted" style="margin:.2rem 0 0">${t('ร้านได้รับออเดอร์แล้ว')}</p>${langBtn()}</div>
    <div class="qcard"><div class="muted">${t('หมายเลขคิวของคุณ')}</div><div class="code">${esc(o.queue_code)}</div>
      <div class="muted">${t('เวลาสั่ง {0} น. · {1}', thTime(o.created_at), o.fulfillment_type === 'dine_in' ? t('ทานที่ร้าน') : t('กลับบ้าน'))}</div>
      <div class="muted" style="margin-top:.3rem">${t('ยอด {0} · {1} ชำระตอนมารับอาหาร', baht(o.total_satang), pay.method === 'cash' ? t('เงินสด') : t('สแกนจ่าย'))}</div>

    <button class="linkbtn" data-go="#/menu">${t('กลับหน้าเมนู')}</button>
  </div>`;
};

function messageCard(m) {
  const o = S.myOrders.find(x => x.id === m.order_id);
  const sug = (m.suggestions || []).map(id => S.items.find(x => x.id === id)).filter(Boolean);
  return `<div class="msg ${m.read_at ? 'read' : ''}">
    <div class="oc-head"><span class="t">${esc(m.title)}</span><span class="muted">${esc(m.queue_code)} · ${thTime(m.created_at)}</span></div>
    ${m.body ? `<div style="margin-top:.25rem">${esc(m.body)}</div>` : ''}
    ${sug.length ? `<div class="muted" style="margin-top:.5rem">${t('เมนูแนะนำแทน')}</div><div class="sug">${sug.map(x => x.is_available
      ? `<button class="btn ghost sm" data-quick="${x.id}">+ ${esc(enName('item', x.id, x.name))} ${baht(x.price_satang)}</button>` : `<span class="meta-chip">${esc(enName('item', x.id, x.name))} ${t('(หมด)')}</span>`).join('')}</div>` : ''}
    ${canReorder(o) ? `<div class="actions" style="margin-top:.6rem"><button class="btn sm" data-act="reorder" data-id="${o.id}">${t('สั่งอีกครั้ง (คิว {0} เดิม)', esc(o.queue_code))}</button></div>` : ''}
  </div>`;
}
const TRK = {
  new: ['ส่งออเดอร์แล้ว', 'รอร้านรับออเดอร์'], preparing: ['ร้านรับออเดอร์ · กำลังทำ', 'ครัวกำลังเตรียมอาหาร'],
  ready: ['พร้อมรับ', 'มารับอาหารที่หน้าร้านได้เลย'], completed: ['เสร็จสิ้น', 'ส่งมอบอาหารเรียบร้อย'] };
const PROG = ['ส่งแล้ว', 'กำลังทำ', 'พร้อมรับ', 'เสร็จสิ้น'];
// Live queue position (polled from get_queue_board): "N queues ahead of you", which queue the shop is on now, how many are waiting.
function qbInner(o) {
  if (o.status === 'cancelled') return '';
  if (o.status === 'ready') return `<div class="qpos hot">${t('อาหารพร้อมแล้ว · มารับที่หน้าร้านได้เลย')}</div>`;
  if (o.status === 'completed') return `<div class="qpos">${t('เสร็จสิ้นแล้ว ขอบคุณค่ะ')}</div>`;
  const q = S.qb, mine = q?.mine?.find(x => x.order_id === o.id), ahead = mine ? mine.ahead : null;
  const pos = ahead == null ? t('กำลังดูลำดับ…') : ahead === 0 ? (o.status === 'preparing' ? t('ถึงตาคุณแล้ว · ร้านกำลังทำอาหารของคุณ') : t('คุณเป็นลำดับถัดไป')) : t('ลำดับที่ <b>{0}</b> · ก่อนหน้าคุณอีก <b>{1}</b> ออเดอร์', ahead + 1, ahead);
  return `<div class="qpos ${ahead === 0 ? 'hot' : ''}">${pos}</div>` + (q ? `<div class="qmeta"><span>${t('ร้านกำลังทำบัตรคิว <b>{0}</b>', esc(q.now_serving || '–'))}</span><span>${t('ออเดอร์รอทำ <b>{0}</b>', q.waiting_count)}</span></div>` : '');
}
const paintQB = () => document.querySelectorAll('[data-qb]').forEach(el => { const o = S.myOrders.find(x => x.id === el.dataset.qb); if (o) el.innerHTML = qbInner(o); });
async function refreshQB() { try { S.qb = await rpc('get_queue_board', { p_store_id: CONFIG.store }); paintQB(); } catch (_) {} }
setInterval(() => { if (['orders', 'done'].includes(route()[0]) && !document.hidden) refreshQB(); }, 8000);

// First layer: queue number + position (+ compact progress). Everything else sits in collapsible layers below.
function queueLayer(o) {
  const steps = ['new', 'preparing', 'ready', 'completed'], idx = steps.indexOf(o.status);
  return `<div class="qlayer"><div class="muted" style="color:inherit;opacity:.8">${t('เลขคิวของคุณ')}</div><div class="code">${esc(o.queue_code)}</div>
    <div data-qb="${o.id}">${qbInner(o)}</div>
    ${o.status === 'cancelled' ? `<div class="banner" style="margin:.7rem 0 0">${o.cancel_source === 'owner' ? t('ร้านยกเลิก') : t('คุณยกเลิกเอง')}${o.cancel_reason ? ' · ' + esc(o.cancel_reason) : ''}</div>`
      : `<div class="qprog">${PROG.map((l, i) => `<div class="${i <= idx ? 'on' : ''} ${i === idx && o.status !== 'completed' ? 'cur' : ''}"><i></i>${t(l)}</div>`).join('')}</div>`}
    ${o.status === 'new' ? `<button class="qcancel" data-act="cust-cancel" data-id="${o.id}">${t('ยกเลิกออเดอร์')}</button>` : ''}</div>`;
}
// Second layer content: step-by-step timeline + items + payment.
function orderDetail(o) {
  const steps = ['new', 'preparing', 'ready', 'completed'], idx = steps.indexOf(o.status), pay = o.payments[0] || {}, active = ['new', 'preparing', 'ready'].includes(o.status);
  return `<div class="trk">
    ${o.replaces_order_id ? `<div class="reorder-note">${t('สั่งใหม่แทนออเดอร์ที่ร้านยกเลิก · คิวเดิม')}</div>` : ''}
    ${o.status === 'cancelled' ? `<div class="banner" style="margin:.2rem 0 0">${o.cancel_source === 'owner' ? t('ร้านยกเลิก') : t('คุณยกเลิกเอง')}${o.cancel_reason ? ' · ' + esc(o.cancel_reason) : ''}</div>`
      : `<div class="tl" ${active ? '' : 'style="padding-bottom:.2rem"'}>${(active ? steps : ['completed']).map((st) => { const i = steps.indexOf(st);
        return `<div class="tl-s ${i < idx || o.status === 'completed' ? 'done' : ''} ${i === idx && o.status !== 'completed' ? 'now' : ''}"><div class="tl-n">${i < idx || o.status === 'completed' ? '✓' : i + 1}</div><div><div class="tl-t">${t(TRK[st][0])}</div><div class="tl-d">${t(TRK[st][1])}</div></div></div>`; }).join('')}</div>`}
    <div class="trk-sum">${o.order_items.map(it => `<div class="kv2"><span>${it.quantity} × ${esc(itemView(it).name)}${itemView(it).lines.length ? ` <span class="muted">(${esc(itemView(it).lines.join(' · '))})</span>` : ''}</span></div>`).join('')}
      <div class="kv2" style="border-top:1px solid var(--line);margin-top:.3rem"><span>${t('ยอดรวม')}</span><b>${baht(o.total_satang)}</b></div>
      <div class="kv2"><span>${t('ชำระเงิน')}</span><span>${t(METHOD[pay.method] || '')} · ${t(PAYS[pay.status] || '')}</span></div></div>
    ${canReorder(o) ? `<div class="actions" style="margin-top:.6rem"><button class="btn sm" data-act="reorder" data-id="${o.id}">${t('สั่งอีกครั้ง (คิวเดิม)')}</button></div>` : ''}</div>`;
}
V.orders = () => {
  const latest = S.myOrders[0], rest = S.myOrders.slice(1);
  if (S.msgOpen === undefined) S.msgOpen = unread() > 0;
  S.trkOpen ||= {};
  const msgs = S.messages.length ? `<button class="layer" data-act="msgs" aria-expanded="${S.msgOpen}"><span>${t('ข้อความจากร้าน')}${unread() ? ` <span class="chip-s open">${t('ใหม่ {0}', unread())}</span>` : ''}</span><span class="muted">${t('{0} ข้อความ', S.messages.length)} ${S.msgOpen ? '▴' : '▾'}</span></button>
    ${S.msgOpen ? S.messages.map(messageCard).join('') : ''}` : '';
  const dOpen = !!S.trkOpen['d:' + latest?.id];
  return `
  <div class="topbar"><button class="back" data-go="#/menu">${I.back} ${t('เมนู')}</button><span class="brand">${t('ติดตามออเดอร์')}</span>${langBtn()}</div>

async function ownerMember() {

async function showOwner(tab, arg) {
  if (tab === 'login') { render('login'); return; }
  $('#app').innerHTML = '<div class="login-head" style="padding-top:30vh"><div class="serif" style="font-size:1.4rem">คุณยุ้ย</div><div class="spinner"></div><p class="muted">กำลังตรวจสิทธิ์เจ้าของร้าน…</p></div>';
  const m = await ownerMember();
  if (!m) { const { data: { user } } = await sb.auth.getUser(); S.owner.denied = !!(user && !user.is_anonymous); return render('login'); }
  if (m.role === 'monitor') { S.owner.denied = 'monitor'; return render('login'); }
  await loadMust(sb, 'o'); if (S.must.o) return render('ownermust');
  S.owner.member = m; S.owner.tab = ['menu', 'orders', 'dash', 'profile', 'archive', 'inbox'].includes(tab) ? tab : 'orders';
  S.owner.day = tab === 'archive' && /^\d{4}-\d{2}-\d{2}$/.test(arg || '') ? arg : null;
  await syncRealtimeAuth();
  listen(`store:${CONFIG.store}:orders`, (ev, p) => {
    if (ev === 'order_changed' && p.status === 'new' && !(S.owner.seen || (S.owner.seen = new Set())).has(p.order_id)) {
      S.owner.seen.add(p.order_id); S.owner.bell += 1; beep(); toast('ออเดอร์ใหม่ ' + p.queue_code);
    }
    clearTimeout(S.owner.t); S.owner.t = setTimeout(() => { if (route()[0] === 'owner') loadTab().then(() => render('owner')); }, 250);
  });
  await loadTab(); render('owner'); window.scrollTo(0, 0);
}
async function loadTab() {
  const t = S.owner.tab;

  await loadSec(sb, 'owner');

  if (t === 'orders' || t === 'dash') {
    S.owner.dash = await rpc('get_owner_dashboard_summary', { p_store_id: CONFIG.store });
  }

    const { data, error } = await sb.from('orders')
      .select('id, queue_code, status, fulfillment_type, total_satang, created_at, completed_at, queue_sort_at, customer_note, cancel_reason, replaces_order_id, order_items(menu_item_id, menu_name_snapshot, quantity, customer_note, order_item_options(option_name_snapshot, menu_option_values(menu_option_groups(code)))), payments(id, method, status, amount_satang, payment_refunds(id, amount_satang, status))')
      .eq('store_id', CONFIG.store).eq('business_date', S.owner.dash.business_date).order('queue_sort_at');
    if (error) throw error; S.owner.orders = data;
  }
  if (t === 'archive') await loadArchive();

    if (!S.items.length) await loadMenu(true);

      .eq('store_id', CONFIG.store).order('created_at', { ascending: false }).limit(200);
    if (error) throw error; S.owner.inbox = data;
  }
  if (t === 'profile') {
    const [c, o] = await Promise.all([
      sb.from('daily_closings').select('business_date, revision, summary, closed_at').eq('store_id', CONFIG.store).order('business_date', { ascending: false }).order('revision', { ascending: false }).limit(200),
      sb.from('store_owner_settings').select('notify_new_order, sound_new_order').eq('store_id', CONFIG.store).maybeSingle()
    ]);
    const seen = new Set(); S.owner.closings = (c.data || []).filter(x => !seen.has(x.business_date) && seen.add(x.business_date));
    S.owner.ownerSettings = o.data;
  }
}

function foodFromOrders(orders) {
  const dish = {}, add = {};
  (orders || []).filter(o => o.status !== 'cancelled').forEach(o => (o.order_items || []).forEach(it => {
    const d = dish[it.menu_name_snapshot] || (dish[it.menu_name_snapshot] = { name: it.menu_name_snapshot, qty: 0, total_satang: 0 });
    d.qty += it.quantity; d.total_satang += Number(it.line_total_satang || 0);
    (it.order_item_options || []).filter(x => Number(x.price_delta_satang) > 0).forEach(x => {
      const a = add[x.option_name_snapshot] || (add[x.option_name_snapshot] = { name: x.option_name_snapshot, qty: 0, total_satang: 0 });
      a.qty += it.quantity; a.total_satang += Number(x.price_delta_satang) * it.quantity;
    });
  }));
  const by = (a, b) => b.qty - a.qty || b.total_satang - a.total_satang;
  const items = Object.values(dish).sort(by);
  return items.length ? { items, addons: Object.values(add).sort(by) } : null;
}
async function loadArchive() {
  const since = new Date(Date.now() - 400 * 864e5).toISOString().slice(0, 10);
  const [c, o] = await Promise.all([
    sb.from('daily_closings').select('business_date, revision, summary, closed_at').eq('store_id', CONFIG.store).gte('business_date', since)
      .order('business_date', { ascending: false }).order('revision', { ascending: false }),
    sb.from('orders').select('business_date, status').eq('store_id', CONFIG.store).gte('business_date', since)
  ]);
  if (c.error || o.error) throw (c.error || o.error);
  const days = {};
  const day = (d) => days[d] || (days[d] = { date: d, closings: [], orders: 0 });
  c.data.forEach(x => day(x.business_date).closings.push(x));
  o.data.forEach(x => { if (x.status !== 'cancelled') day(x.business_date).orders += 1; });
  S.owner.archive = Object.values(days).sort((a, b) => b.date.localeCompare(a.date));
  if (S.owner.day) {
    const dd = days[S.owner.day] || { date: S.owner.day, closings: [], orders: 0 };
    const [sum, ol] = await Promise.all([
      rpc('get_owner_dashboard_summary', { p_store_id: CONFIG.store, p_business_date: S.owner.day }),
      sb.from('orders').select('queue_code, status, total_satang, created_at, fulfillment_type, payments(method, status), order_items(menu_name_snapshot, quantity, line_total_satang, order_item_options(option_name_snapshot, price_delta_satang))')
        .eq('store_id', CONFIG.store).eq('business_date', S.owner.day).order('created_at')
    ]);
    if (ol.error) throw ol.error;
    // food list of the day: the copy saved at closing time, else counted from that day's orders
    const sc = dd.closings[0] && dd.closings[0].summary;
    let itemsData = sc && sc.items ? { items: sc.items, addons: sc.addons || [] } : null;
    if (!itemsData) { try { itemsData = await rpc('get_day_items', { p_store_id: CONFIG.store, p_business_date: S.owner.day }); } catch (_) { itemsData = null; } }
    if (!itemsData || !(itemsData.items || []).length) itemsData = foodFromOrders(ol.data) || itemsData; // works even if the DB function is missing
    S.owner.dayData = { ...dd, live: sum, orders: ol.data, itemsData };
  }
}

      ${opts.overlay ? '<label class="crop-opt"><input type="checkbox" id="co" checked> ใส่ชื่อร้านทับบนภาพ (ถ้าภาพมีตัวหนังสือในตัวอยู่แล้ว ให้ติ๊กออก)</label>' : ''}

      <div class="crop-actions"><button class="btn ghost" id="cc" style="flex:1">ยกเลิก</button><button class="btn" id="ck" style="flex:2">ยืนยันใช้รูปนี้</button></div>
    </div>`;
    const frame = $('#cf'); frame.appendChild(img);
    if (opts.overlay) { frame.insertAdjacentHTML('beforeend', heroTextHtml()); $('#co').onchange = (ev) => { frame.querySelector('.hero-text').style.display = ev.target.checked ? '' : 'none'; }; }
    const nw = img.naturalWidth, nh = img.naturalHeight;
    let fw, fh, base, zoom = 1, x = 0, y = 0;
    const clamp = () => { const s = base * zoom; x = Math.min(0, Math.max(fw - nw * s, x)); y = Math.min(0, Math.max(fh - nh * s, y)); };
    const draw = () => { clamp(); img.style.transform = `translate(${x}px, ${y}px) scale(${base * zoom})`; };
    const layout = () => { fw = frame.clientWidth; fh = frame.clientHeight; base = Math.max(fw / nw, fh / nh);

    case 'rm-pic': await act(async () => { S.edit.image_path = null; if (S.edit.id) await saveDishImage(S.edit.id, null); paintEditPic(null); }, S.edit?.id ? 'เอารูปออกแล้ว' : ''); break;
    case 'new-dish': editSheet(null); break;
    case 'opt-edit': { const g = S.links.map(l => l.menu_option_groups).find(x => x && x.id === d.g); const v = g && (g.menu_option_values || []).find(x => x.id === d.id); if (g && v) optSheet(g, v); break; }
    case 'opt-new': { const g = S.links.map(l => l.menu_option_groups).find(x => x && x.id === d.g); if (g) optSheet(g, null); break; }
    case 'opt-save': {
      const e = S.optEdit; if (!e) return;
      const name = $('#o-name').value.trim(), raw = $('#o-price').value.trim(), price = Math.round(parseFloat(raw) * 100);
      if (!name) return toast('กรุณาใส่ชื่อ');
      if (raw === '' || !(price >= 0)) return toast('กรุณาใส่ราคา (ใส่ 0 ถ้าไม่คิดเพิ่ม)');
      await act(async () => {
        await rpc('save_menu_option_value', { p_option_group_id: e.gid, p_option_value_id: e.vid, p_name: name, p_price_satang: price, p_is_available: $('#o-avail').checked });
        closeModal(); await reloadOwner(); }, 'บันทึกแล้ว · ลูกค้าเห็นราคาใหม่ทันที'); break; }
    case 'vault-restore': await act(async () => {
      await rpc('set_menu_archived', { p_menu_item_id: d.id, p_is_archived: false });
      await rpc('set_menu_availability', { p_menu_item_id: d.id, p_is_available: true });
      await reloadOwner(); }, 'เรียกกลับแล้ว · ลูกค้าเห็นเมนูนี้ทันที'); break;
    case 'del-ask': {
      const it = S.items.find(x => x.id === d.id); if (!it) return;
      openModal(`<h3>ลบเมนูนี้ถาวร?</h3>
        <p><b>${esc(it.name)}</b> <span class="muted">${esc(it.sku)} · ${baht(it.price_satang)}</span></p>
        <p class="muted">ลบแล้วเรียกกลับไม่ได้ ลูกค้าจะไม่เห็นเมนูนี้อีก · ถ้าเมนูนี้เคยมีออเดอร์ ระบบจะไม่ให้ลบ (เพื่อไม่ให้ประวัติเสียหาย) ให้เก็บเข้าคลังแทน · ถ้าแค่อยากพักขาย ให้ใช้ “เก็บเข้าคลัง” ซึ่งเรียกกลับได้</p>
        <div class="actions" style="margin-top:1rem"><button class="btn ghost" style="flex:1" data-act="close">ไม่ลบ</button>
          <button class="btn danger" style="flex:1" data-act="del-yes" data-id="${it.id}">ลบถาวร</button></div>`);
      break; }
    case 'del-yes': await act(async () => {
      const path = await rpc('delete_menu_item', { p_menu_item_id: d.id });
      if (path) { try { await sb.storage.from('menu-images').remove([path]); } catch (_) {} }
      closeModal(); await reloadOwner(); }, 'ลบเมนูแล้ว'); break;
    case 'save-dish': {
      const name = $('#e-name').value.trim(), price = Math.round(parseFloat($('#e-price').value) * 100), cat = $('#e-cat').value;
      if (!name || !(price >= 0)) return toast('กรุณาใส่ชื่อและราคา');
      await act(async () => {
        let id = S.edit.id;
        if (!id) {
          const r = await rpc('create_menu_item', { p_store_id: CONFIG.store, p_category_id: cat, p_sku: 'M' + Date.now().toString(36).toUpperCase(), p_name: name,
            p_description: null, p_price_satang: price, p_image_path: S.edit.image_path, p_is_available: $('#e-avail').checked, p_sort_order: 999 });
          id = r[0].menu_item_id;
        } else {
          const it = S.items.find(x => x.id === id);
          await rpc('update_menu_item', { p_menu_item_id: id, p_name: name, p_description: it.description, p_price_satang: price, p_category_id: cat,
            p_image_path: S.edit.image_path, p_is_available: $('#e-avail').checked });
          const arch = $('#e-arch')?.checked ?? false;
          if (arch !== it.is_archived) await rpc('set_menu_archived', { p_menu_item_id: id, p_is_archived: arch });
        }
        await rpc('set_menu_recommended', { p_menu_item_id: id, p_is_recommended: $('#e-rec').checked });
        closeModal(); await reloadOwner();
      }, 'บันทึกแล้ว · ลูกค้าเห็นทันที');
      break;
    }
    case 'logout': await sb.auth.signOut(); unlistenAll(); S.owner = { tab: 'orders', orders: [], filter: 'all', dash: null, closings: [], bell: 0 }; go('#/'); break;
    case 'close': case 'scrim': closeModal(); if (route()[0] === 'owner' && S.owner.tab === 'menu') render('owner'); break;
  }
});
document.addEventListener('change', async (e) => {
  const t = e.target;
  if (t.dataset.impReplace !== undefined) { const imp = S.owner.imp; imp.replace = t.checked; imp.plan = planImport(imp.entries, imp.replace); importSheet(); return; }
  if (t.dataset.import && !t.files?.length) { toast('ไม่พบไฟล์ที่เลือก เครื่องอาจไม่ส่งไฟล์นี้กลับมา ลองเลือกไฟล์อื่นหรือย้ายไฟล์มาไว้ในเครื่องก่อน'); return; }
  if (t.dataset.import && t.files?.length) {
    const kind = t.dataset.import, files = [...t.files]; t.value = '';
    $('#modal').querySelector('.sheet').insertAdjacentHTML('beforeend', '<div class="spinner" aria-label="กำลังอ่านไฟล์"></div>');
    try {
      const entries = kind === 'zip' ? await readZipEntries(files[0]) : files.map(f => ({ name: f.name, size: f.size, blob: async () => f }));
      const imgs = entries.filter(x => IMG_EXT.test(x.name));
      if (!imgs.length) throw new Error('ไม่พบไฟล์รูป (JPG, PNG, WEBP) ในที่เลือก');
      S.owner.imp = { entries: imgs, total: imgs.length, replace: false, plan: null };
      S.owner.imp.plan = planImport(imgs, false); importSheet();
    } catch (err) { S.owner.imp = null; importSheet(); toast(nice(err)); }
    return;
  }
  if (t.dataset.soItem !== undefined && t.checked) { soldOutSheet(t.value); return; }
  if (t.dataset.cart !== undefined) {
    const l = S.cart[t.dataset.cart], g = groupsOf(l.id).find(x => x.id === t.dataset.group), ids = g.values.map(v => v.id);
    const picks = l.opts.filter(o => !ids.includes(o)).concat(t.value);
    Object.assign(l, makeLine(l.id, l.qty, picks, l.note)); saveCart(); render(); return;
  }
  if (t.name === 'so-sug' && document.querySelectorAll('input[name=so-sug]:checked').length > 3) { t.checked = false; toast('แนะนำได้ไม่เกิน 3 เมนู'); return; }
  if (t.dataset.opt) {
    const g = groupsOf(S.draft.id).find(x => x.id === t.dataset.opt), ids = g.values.map(v => v.id);
    if (g.selection_type === 'single') S.draft.picked = S.draft.picked.filter(p => !ids.includes(p)).concat(t.value);
    else {
      S.draft.picked = t.checked ? S.draft.picked.concat(t.value) : S.draft.picked.filter(p => p !== t.value);
      const me = g.values.find(v => v.id === t.value);
      if (t.checked && me && (me.name === 'ปูนา' || me.name === 'ปูทะเล')) { const other = g.values.find(v => v.name === (me.name === 'ปูนา' ? 'ปูทะเล' : 'ปูนา')); if (other) S.draft.picked = S.draft.picked.filter(p => p !== other.id); }
    }
    S.draft.note = $('#note')?.value || ''; render(); return;
  }
  if (t.dataset.upload && t.files?.[0]) {
    const file = t.files[0], kind = t.dataset.upload; t.value = '';
    const rowItem = kind === 'row' ? S.items.find(x => x.id === t.dataset.id) : null;
    const blob = await cropImage(file, kind === 'hero' ? 3 / 2 : 4 / 3, kind === 'hero' ? 'ภาพปกเมนูแนะนำ' : rowItem ? 'รูป ' + rowItem.name : 'รูปเมนู', { overlay: kind === 'hero' });
    if (!blob) return;
    await act(async () => {
      await withBusy('กำลังอัปโหลดรูป…', async () => {
        const path = await uploadBlob(blob, kind === 'hero' ? (blob.overlay ? 'hero-t' : 'hero') : rowItem ? rowItem.sku : '');
        if (kind === 'row') { await saveDishImage(rowItem.id, path); render('owner'); }
        else if (kind === 'hero') { await rpc('set_store_hero_image', { p_store_id: CONFIG.store, p_image_path: path }); await loadSettings(); await signImages(); render('owner'); }
        else {
          S.edit.image_path = path;
          if (S.edit.id) await saveDishImage(S.edit.id, path);
          paintEditPic(path);
        }
      });
    }, kind === 'hero' ? 'ภาพปกขึ้นแล้ว · ลูกค้าเห็นทันที' : (kind === 'row' || S.edit?.id) ? 'บันทึกรูปแล้ว · ลูกค้าเห็นทันที' : 'ได้รูปแล้ว · กดบันทึกเพื่อเพิ่มเมนู');
    return;
  }
  if (t.dataset.act === 'accepting') await act(async () => { await rpc('set_store_accepting_orders', { p_store_id: CONFIG.store, p_is_accepting_orders: t.checked }); await loadSettings(); render('owner'); },
    t.checked ? 'เปิดร้านแล้ว · รับออเดอร์ได้' : 'ปิดรับออเดอร์แล้ว');
  if (t.dataset.act === 'sound') await act(async () => {
    await rpc('update_store_owner_settings', { p_store_id: CONFIG.store, p_notify_new_order: true, p_sound_new_order: t.checked }); S.owner.ownerSettings.sound_new_order = t.checked; }, 'บันทึกแล้ว');
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; S.more = 12; const p = e.target.selectionStart; render(); const el = $('#q'); if (el) { el.focus(); el.setSelectionRange(p, p); } }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
const _beep = beep; beep = () => { if (S.owner.ownerSettings?.sound_new_order !== false) _beep(); };

// Email-link sign-in finishes asynchronously; re-check the owner area once it lands.
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' && route()[0] === 'owner') setTimeout(show, 0); });
// Surface any crash as a visible message instead of failing silently — this is what we need
// to see on a phone where there is no way to open developer console.
window.addEventListener('error', (e) => toast(t('เกิดข้อผิดพลาด: {0}', e.error?.message || e.message || t('ไม่ทราบสาเหตุ'))));
window.addEventListener('unhandledrejection', (e) => toast(t('เกิดข้อผิดพลาด: {0}', e.reason?.message || e.reason || t('ไม่ทราบสาเหตุ'))));

setInterval(() => { if (S.closedStore && route()[0] === 'menu' && !document.hidden) { S.queue = null; show(); } }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && route()[0] === 'yui' && S.yui.state === 'ready') { yWake(); loadYui().then(paintYui).catch(() => {}); } });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
(async () => {
  let linkWho = null;
  if (RESET_CODE) {
    try {
      const { error } = await cliOf(resetMark.who).auth.exchangeCodeForSession(RESET_CODE);
      history.replaceState(null, '', location.pathname + (PORTAL[resetMark.who] || '#/'));
      if (error) toast('ลิงก์นี้ใช้ไม่ได้ในเบราว์เซอร์นี้ ให้ใช้ "รหัสจากอีเมล" แทน (ปุ่ม ลืมรหัสผ่าน → มีรหัสจากอีเมลแล้ว)');
      else linkWho = resetMark.who;
    } catch (_) { history.replaceState(null, '', location.pathname + (PORTAL[resetMark.who] || '#/')); }
  } else if (BOOT_ERR) {
    history.replaceState(null, '', location.pathname + ((resetMark && PORTAL[resetMark.who]) || '#/'));
    toast('ลิงก์หมดอายุหรือถูกใช้ไปแล้ว ให้กด ลืมรหัสผ่าน เพื่อขอรหัสใหม่');
  }
  await show();
  if (linkWho) forgotLinkSheet(linkWho);
})();
</script>
</body>
